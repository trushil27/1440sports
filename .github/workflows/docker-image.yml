# Proves the deployable image builds and starts (independently of the hosting platform's builder).
name: Docker image

on:
  push:
    branches: ["**"]
    paths: ["Dockerfile", "pipeline/**", "api/**", "db/**", ".github/workflows/docker-image.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t intel:ci .
      - name: Smoke — entrypoint runs, schedule exits outside the slot (no DB needed for the slot check)
        run: |
          docker run --rm intel:ci python -c "import intel.schedule, intel_api.app, weasyprint; print('imports ok')"
          docker run --rm --entrypoint python intel:ci -m intel.schedule || true
