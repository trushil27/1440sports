# Proves the deployable image builds and starts (independently of the hosting platform's builder).
name: Docker image

on:
  push:
    branches: ["**"]
    paths: ["Dockerfile", "pipeline/**", "api/**", "db/**", ".github/workflows/docker-image.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t intel:ci .
      - name: Smoke — imports resolve and the schedule step exits cleanly outside the 05:30 slot
        # --entrypoint bypasses migrations + seeds (there is no database on the runner);
        # the entrypoint itself is exercised end-to-end against Postgres in the step below.
        run: |
          docker run --rm --entrypoint python intel:ci -c "import intel.schedule, intel_api.app, weasyprint; print('imports ok')"
          docker run --rm --entrypoint python intel:ci -m intel.schedule
      - name: Entrypoint — migrations + seeds against a hosted-style DATABASE_URL, then the schedule step
        # Railway injects postgresql://…; the code must pin the psycopg driver itself.
        run: |
          docker network create ci
          docker run -d --name pg --network ci -e POSTGRES_PASSWORD=pg -e POSTGRES_DB=intel postgres:16
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
          docker run --rm --network ci -e DATABASE_URL=postgresql://postgres:pg@pg:5432/intel intel:ci 2>&1 | tee /tmp/entry.log
          grep -q "database: pg:5432/intel — reachable" /tmp/entry.log
          grep -q "\[entrypoint\] applying migrations" /tmp/entry.log
      - name: Entrypoint — with no DATABASE_URL the cron container diagnoses, emails (dry-run outbox) and exits 0 without looping
        run: |
          docker run --rm -e EXECUTION_MODE=dry_run -e OPERATOR_EMAIL=ops@example.com intel:ci 2>&1 | tee /tmp/nodb.log
          grep -q "DATABASE_URL: MISSING" /tmp/nodb.log
          grep -q "alert email outbox" /tmp/nodb.log
          grep -q "run skipped (exit 0, no restart loop)" /tmp/nodb.log
