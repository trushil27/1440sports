# Publishes the desk app (site/) to the gh-pages branch on every push to main that touches it.
# GitHub serves that branch at https://trushil27.github.io/1440sports/ (public repo; Pages is
# enabled automatically for a gh-pages branch — the Pages API itself is not available to the
# workflow token). The daily job refreshes the live site through Netlify once NETLIFY_AUTH_TOKEN
# + NETLIFY_SITE_ID are set; until then a push of site/ is the refresh.
name: Pages

on:
  push:
    branches: ["main"]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push site/ to gh-pages
        run: |
          set -e
          git config user.name "1440 desk publisher"
          git config user.email "noreply@1440sports.com"
          rm -rf /tmp/pages && mkdir -p /tmp/pages
          cp -r site/. /tmp/pages/
          touch /tmp/pages/.nojekyll
          cd /tmp/pages
          git init -q -b gh-pages
          git add -A
          git -c user.name="1440 desk publisher" -c user.email="noreply@1440sports.com" commit -q -m "desk: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
