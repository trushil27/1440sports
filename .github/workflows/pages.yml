# Publishes the desk app (site/) on every push to main that touches it.
#
# Two destinations, both optional, both live at once if you want:
#   1. This repo's gh-pages branch — the default. GitHub serves it at
#      https://trushil27.github.io/1440sports/, which carries a personal username.
#   2. A SEPARATE repo you own, set with the SITE_REPO variable + SITE_REPO_TOKEN secret.
#      Point it at <org>/<org>.github.io in a free GitHub organisation and the desk lives at
#      https://<org>.github.io/ with no personal name and no DNS. This repo does not move:
#      only the built site is pushed there. See docs/APP_URL.md.
#
#   3. Netlify — set the NETLIFY_AUTH_TOKEN secret and nothing else. The job claims (and, on
#      the first run, creates) the site named by NETLIFY_SITE_NAME and publishes there, so the
#      address has neither a personal name nor a GitHub one. No organisation, no DNS.
#
# This workflow needs no model API key and cannot spend anything: it copies files and pushes.
name: Pages

on:
  push:
    branches: ["main"]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # The secrets context cannot be read in a step's `if`, so the presence test becomes an
      # env var here; the values themselves are only used by the Netlify step.
      HAS_NETLIFY: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_SITE_NAME: ${{ vars.NETLIFY_SITE_NAME || '1440-intelligence' }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site
        run: |
          set -e
          rm -rf /tmp/pages && mkdir -p /tmp/pages
          cp -r site/. /tmp/pages/
          touch /tmp/pages/.nojekyll
          # A 1440-owned address instead of a github.io one. Opt-in: set the repo variable
          # APP_DOMAIN (e.g. intel.1440sports.com) ONLY after the DNS record for it points at
          # GitHub — publishing this file without the DNS record takes the live site down.
          if [ -n "${{ vars.APP_DOMAIN }}" ]; then
            echo "${{ vars.APP_DOMAIN }}" > /tmp/pages/CNAME
            echo "custom domain: ${{ vars.APP_DOMAIN }}"
          fi
          cd /tmp/pages
          git init -q -b gh-pages
          git add -A
          git -c user.name="1440 desk publisher" -c user.email="noreply@1440sports.com" \
            commit -q -m "desk: ${GITHUB_SHA::7}"

      - name: Publish to this repo's gh-pages
        if: vars.SITE_REPO == ''
        run: |
          cd /tmp/pages
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      # Netlify, the moment the token exists — so the address is live without waiting for a
      # daily run (which costs model time; this step costs none).
      - uses: actions/setup-python@v5
        if: env.HAS_NETLIFY == 'true'
        with:
          python-version: "3.12"
      - name: Publish to Netlify
        if: env.HAS_NETLIFY == 'true'
        env:
          PYTHONPATH: pipeline
        run: |
          pip install -q httpx
          python - <<'PY'
          import io, os, zipfile
          from pathlib import Path
          from types import SimpleNamespace

          from intel import netlify

          buf = io.BytesIO()
          with zipfile.ZipFile(buf, "w", zipfile.ZIP_DEFLATED) as z:
              for p in sorted(Path("site").rglob("*")):
                  if p.is_file():
                      z.write(p, p.relative_to("site").as_posix())
          settings = SimpleNamespace(
              netlify_auth_token=os.environ["NETLIFY_AUTH_TOKEN"],
              netlify_site_id=os.environ.get("NETLIFY_SITE_ID") or None,
              netlify_site_name=os.environ["NETLIFY_SITE_NAME"],
          )
          site = netlify.resolve_site_id(settings)
          print("netlify:", netlify.deploy(buf.getvalue(), settings.netlify_auth_token, site))
          PY

      - name: Publish to ${{ vars.SITE_REPO }} (no personal name in the URL)
        if: vars.SITE_REPO != ''
        env:
          TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          set -e
          if [ -z "$TOKEN" ]; then
            echo "::error::SITE_REPO is set to '${{ vars.SITE_REPO }}' but the SITE_REPO_TOKEN secret is missing — the site cannot be pushed there. Add the token, or clear SITE_REPO to fall back to this repo's gh-pages."
            exit 1
          fi
          cd /tmp/pages
          # An <org>/<org>.github.io repo serves from its DEFAULT branch, not gh-pages.
          git branch -M main
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ vars.SITE_REPO }}.git" main
          echo "published to https://github.com/${{ vars.SITE_REPO }}"
