# Email a brief that already exists — the card body and the 2-page PDF — to the operator.
#
# Every signal the desk shows carries a verified case, a PDF and an app page, but only the
# day's hero was ever emailed; the backlog cases were published to the app and nothing else.
# This is the door for the rest: Actions → Send a brief → Run workflow → type the number(s).
#
# It runs the mailer and the renderer ONLY — no scanner, verifier or writer — so it costs
# nothing on the model API. The MD is never a recipient: intel.resend addresses the operator.
name: Send a brief

on:
  workflow_dispatch:
    inputs:
      numbers:
        description: "Brief number(s), space separated — e.g. 241, or 241 240"
        required: true
        type: string
      recipient:
        description: "Who receives it"
        type: choice
        options: [operator, md]
        default: operator
      dry_run:
        description: "Write the .eml to the run's artifact instead of sending it"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: intel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:pg@localhost:5432/intel
      OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL }}
      # No ANTHROPIC_API_KEY: this workflow cannot spend anything on the model. MD_EMAIL is
      # passed ONLY when the operator chooses "md" as the recipient (9 Sep 2026: "share that
      # email … to Ricky"); the operator is copied on every such send.
      MD_EMAIL: ${{ inputs.recipient == 'md' && secrets.MD_EMAIL || '' }}
      EXECUTION_MODE: ${{ inputs.dry_run && 'dry_run' || 'shadow' }}
      GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
      GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
      GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
      GRAPH_SENDER: ${{ secrets.GRAPH_SENDER }}
      GRAPH_REFRESH_TOKEN: ${{ secrets.GRAPH_REFRESH_TOKEN }}
      # The link in the body comes from here. Without it the config default
      # (intel.1440sports.com, a domain nobody owns) went out in a real email.
      APP_BASE_URL: ${{ vars.APP_BASE_URL || (secrets.NETLIFY_AUTH_TOKEN && format('https://{0}.netlify.app', vars.NETLIFY_SITE_NAME || '1440-intelligence')) || 'https://trushil27.github.io/1440sports/' }}
      PDF_STORAGE_DIR: storage/briefs
      OUTBOX_DIR: storage/outbox
      PYTHONPATH: pipeline
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for WeasyPrint
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2 fonts-liberation
      - name: Install
        run: pip install -q -e "pipeline[render]"
      - name: Rebuild the desk's memory from the repo
        run: |
          python -m alembic -c db/alembic.ini upgrade head
          python -m intel.seed
          python -m intel.backfill
      - name: Send
        run: python -m intel.resend ${{ inputs.numbers }} --to "${{ inputs.recipient }}" --cc-operator
      - name: Keep the PDFs and outbox as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: send-brief-${{ github.run_id }}
          path: storage
          retention-days: 7
          if-no-files-found: ignore
