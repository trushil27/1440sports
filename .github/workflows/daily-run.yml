# The daily run — the scheduler for the 1440 Intelligence desk. No server of ours has to stay
# up: every morning GitHub starts a runner with a throwaway Postgres, rebuilds the desk's
# memory from this repo (history, recorded cases, signal checks), runs the day (scan → verify
# → write → audit → render → send at 06:00 London), then saves the new case(s) back into the
# repo and republishes the live app (gh-pages). The repo is the memory.
#
# GitHub cron is best-effort and on this repo it has run FOUR TO FIVE HOURS late every day
# (5 Sep 09:10Z for an 04:30Z cron; 6 Sep 08:45Z and 09:32Z; 7 Sep 09:34Z and 10:32Z). The job
# used to gate on "is it 05:xx in London?" and threw every one of those away, so no signal was
# produced. It now fires hourly across the morning and asks the repo whether today's signal
# already exists instead of asking the clock: the first firing to land does the work, the rest
# see the saved case and exit in seconds. intel.schedule sends immediately when the 06:00 slot
# has already passed, so a late start still delivers.
#
# Punctuality comes from OUTSIDE GitHub. A Claude Routine ("1440 desk — 06:00 London signal")
# dispatches this workflow at 04:40 UTC and a second at 05:40 UTC; routines fire within
# minutes of their time, so the brief lands about 06:00 London. Whichever of the two is the
# right one for the season runs and the other is held by the gate below — before 05:00 London
# is too early, and once the day has a saved case it is done. The six crons stay as a
# fallback for the day the routine is off; a duplicate firing costs seconds, not an email.
name: Daily run

on:
  schedule:
    - cron: "20 4 * * *"
    - cron: "20 5 * * *"
    - cron: "20 6 * * *"
    - cron: "20 7 * * *"
    - cron: "20 8 * * *"
    - cron: "20 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        # Default FALSE on purpose: the 06:00 Claude Routine dispatches this workflow with no
        # inputs, and a default of true would let it bypass the gate — running an hour early
        # once the clocks go back, or issuing a second brief on a day that already has one.
        # Tick it only to override that (a second signal in one day, or a run before 05:00).
        description: "Run even if today's signal already went out, or it is before 05:00 London"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: intel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:pg@localhost:5432/intel
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL }}
      # MD_EMAIL is deliberately NOT passed (operator decision, 6 Sep 2026): nothing reaches
      # the MD — no brief, no failure notice — until the desk has run clean for several days.
      # Shadow mode already routes everything to the operator; this makes it true in any mode.
      # Restore the line below to resume MD delivery, and only with EXECUTION_MODE=production.
      #   MD_EMAIL: ${{ secrets.MD_EMAIL }}
      EXECUTION_MODE: ${{ vars.EXECUTION_MODE || 'shadow' }}
      GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
      GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
      GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
      GRAPH_SENDER: ${{ secrets.GRAPH_SENDER }}
      GRAPH_REFRESH_TOKEN: ${{ secrets.GRAPH_REFRESH_TOKEN }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      PAGES_REPO: ${{ github.repository }}
      # 1440-intelligence.netlify.app as soon as the Netlify site is configured (operator
      # decision, 7 Sep 2026); APP_BASE_URL overrides it; the github.io URL is the fallback.
      APP_BASE_URL: ${{ vars.APP_BASE_URL || (secrets.NETLIFY_SITE_ID && 'https://1440-intelligence.netlify.app') || 'https://trushil27.github.io/1440sports/' }}
      DESK_API_URL: ${{ vars.DESK_API_URL }}
      REBUILD_BACKLOG_PER_RUN: ${{ vars.REBUILD_BACKLOG_PER_RUN || '1' }}
      FRESHNESS_DAYS_TRACK1: ${{ vars.FRESHNESS_DAYS_TRACK1 || '90' }}
      FRESHNESS_FALLBACK_DAYS: ${{ vars.FRESHNESS_FALLBACK_DAYS || '90' }}
      PDF_STORAGE_DIR: storage/briefs
      SITE_DIR: storage/site
      PYTHONPATH: pipeline
      TZ: Europe/London
    steps:
      # The repo, not the clock, decides whether there is work: a saved case record for
      # today means the signal already went out, whatever time this firing arrived.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Has today's signal already gone out?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "forced run at $(TZ=Europe/London date)"
          else
            PYTHONPATH=pipeline python3 -m intel.day_status --github-output /tmp/day_status
            if grep -q "hold=true" /tmp/day_status; then
              echo "run=no" >> "$GITHUB_OUTPUT"
              echo "holding: today is already done, or it is before 05:00 London"
            else
              echo "run=yes" >> "$GITHUB_OUTPUT"
              echo "no signal saved for today yet (local $(TZ=Europe/London date +%H:%M)) — running"
            fi
          fi
      - name: Secrets present?
        if: steps.gate.outputs.run == 'yes'
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set (GitHub → Settings → Secrets and variables → Actions)"; exit 1
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for WeasyPrint
        if: steps.gate.outputs.run == 'yes'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2 fonts-liberation
      - name: Install
        if: steps.gate.outputs.run == 'yes'
        run: pip install -q -e "pipeline[render]" -e api
      - name: Rebuild the desk's memory from the repo (migrate → seed → history, cases, checks)
        if: steps.gate.outputs.run == 'yes'
        run: |
          python -m alembic -c db/alembic.ini upgrade head
          python -m intel.seed
          python -m intel.backfill
      - name: Run the day, send at 06:00 London, build the backlog, republish the app
        if: steps.gate.outputs.run == 'yes'
        run: python -m intel.schedule --force
      - name: Save today's case(s) into the repo
        if: steps.gate.outputs.run == 'yes'
        run: |
          python -m intel.case_record --sync --out pipeline/intel/cases
          git config user.name "1440 desk"
          git config user.email "noreply@1440sports.com"
          git add pipeline/intel/cases
          if git diff --cached --quiet; then
            echo "no new case to save"
          else
            git commit -m "Daily run $(TZ=Europe/London date +%Y-%m-%d): recorded case(s)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Keep the run's storage as an artifact (PDFs, outbox, logs) for 30 days
        if: always() && steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-${{ github.run_id }}
          path: storage
          retention-days: 30
          if-no-files-found: ignore
