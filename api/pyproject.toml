[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intel-api"
version = "0.1.0"
description = "1440 Intelligence Platform — FastAPI read/write access for the web app"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "webauthn>=2.0",
  "itsdangerous>=2.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]
# `intel` (the pipeline package) must be installed alongside: pip install -e pipeline -e api

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["intel_api*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["intel", "intel_api", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
