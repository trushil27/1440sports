# Alembic configuration for the 1440 Intelligence Platform database.
# Run from the repo root:  alembic -c db/alembic.ini upgrade head
# The URL comes from $DATABASE_URL (see db/env.py); the value below is a local default only.

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/../pipeline
path_separator = os
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = postgresql+psycopg://postgres@localhost:5432/intel

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
