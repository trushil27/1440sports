<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1440 Intelligence Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@400;500;600;700&display=swap">
<style>
  /* 1440 Sports — the intelligence engine in the Mission Control shell. Navy rail, gold
     actions, Poppins for the interface, Lora for prose. Brand marks are inlined below. */
  :root {
    --sans: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
    --serif: 'Lora', Georgia, serif;
    --navy: #191a48; --navy-2: #202261; --gold: #c9a96a; --gold-2: #d1ae7a; --gold-deep: #9a7a3f;
    --ground: #f4f3ee; --panel: #ffffff; --panel-2: #f2f0ea; --hair: #e3e0d8; --ink: #1a1c2e; --ink-2: #444660; --muted: #737590;
    --ok: #2f7d4f; --ok-bg: #e7f3ea; --warn: #9a6b1f; --warn-bg: #f8f0dd; --bad: #9a2f2f; --bad-bg: #f6e6e6; --info: #2f4f9a; --info-bg: #e6ebf6;
    --shadow: 0 1px 2px rgba(25,26,72,.05), 0 12px 32px -20px rgba(25,26,72,.3);
    --side-w: 272px; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0f1024; --panel: #171838; --panel-2: #1f2046; --hair: #2b2d57; --ink: #ece9df; --ink-2: #c9c6bd; --muted: #9d9fb8;
      --ok: #7fc59a; --ok-bg: #163021; --warn: #d9bc8a; --warn-bg: #33290f; --bad: #e08a8a; --bad-bg: #3a1a1a; --info: #9fb4ea; --info-bg: #1b2447;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -20px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0f1024; --panel: #171838; --panel-2: #1f2046; --hair: #2b2d57; --ink: #ece9df; --ink-2: #c9c6bd; --muted: #9d9fb8;
    --ok: #7fc59a; --ok-bg: #163021; --warn: #d9bc8a; --warn-bg: #33290f; --bad: #e08a8a; --bad-bg: #3a1a1a; --info: #9fb4ea; --info-bg: #1b2447;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -20px rgba(0,0,0,.8);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .side { transition: none !important; } }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .nc { color: var(--navy); } [data-theme="dark"] .nc { color: var(--ink); }

  /* top bar */
  .top { position: sticky; top: 0; z-index: 20; height: 66px; background: var(--panel); border-bottom: 1px solid var(--hair); display: flex; align-items: center; gap: 18px; padding: 0 24px; }
  .top .logo { height: 26px; width: auto; display: block; }
  .top .logo.dark { display: none; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .top .logo.light { display: none; } :root:not([data-theme="light"]) .top .logo.dark { display: block; } }
  :root[data-theme="dark"] .top .logo.light { display: none; } :root[data-theme="dark"] .top .logo.dark { display: block; }
  .top .divider { width: 1px; height: 26px; background: var(--hair); }
  .top .product { font-weight: 700; letter-spacing: .2em; text-transform: uppercase; font-size: 14px; color: var(--navy); }
  [data-theme="dark"] .top .product { color: var(--ink); }
  .top .right { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .top .clock { background: var(--panel-2); border-radius: 999px; padding: 7px 14px; font-weight: 600; color: var(--navy); font-variant-numeric: tabular-nums; letter-spacing: .06em; }
  [data-theme="dark"] .top .clock { color: var(--ink); }
  .top .clock i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 8px; }
  .menu { display: none; background: none; border: 0; padding: 6px; color: var(--navy); }
  [data-theme="dark"] .menu { color: var(--ink); }

  /* shell */
  .shell { display: grid; grid-template-columns: var(--side-w) 1fr; min-height: calc(100vh - 66px); }
  .side { background: linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 60%, #14153c 100%); color: #d8d6e6; padding: 28px 0 22px; display: flex; flex-direction: column; }
  .side .group { font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; color: #8f91b3; padding: 16px 30px 8px; }
  .side a { display: flex; align-items: center; gap: 14px; padding: 12px 30px; font-size: 12.5px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; color: #e7e5f1; border-left: 3px solid transparent; }
  .side a svg { width: 18px; height: 18px; flex: none; opacity: .8; }
  .side a:hover { background: rgba(255,255,255,.05); }
  .side a.active { background: rgba(255,255,255,.08); border-left-color: var(--gold); color: #fff; }
  .side a .count { margin-left: auto; font-size: 11px; background: rgba(255,255,255,.12); border-radius: 999px; padding: 2px 9px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .side .user { margin-top: auto; padding: 18px 30px 0; border-top: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 12px; font-size: 13px; }
  .side .user .av { width: 34px; height: 34px; border-radius: 50%; background: var(--gold); color: var(--navy); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  .side .user small { display: block; color: #9c9ec0; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; }
  .side .brand { padding: 0 30px 18px; }
  .side .brand img { height: 22px; opacity: .95; }

  main { padding: 36px 44px 90px; max-width: 1220px; width: 100%; }
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: fixed; inset: 66px 0 0 0; z-index: 30; width: var(--side-w); transform: translateX(-100%); transition: transform .2s ease; }
    .side.open { transform: none; }
    .menu { display: inline-block; }
    main { padding: 22px 18px 60px; }
  }

  /* page furniture */
  .eyebrow { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  h1 { font-family: var(--sans); font-weight: 600; font-size: 34px; letter-spacing: -.01em; color: var(--navy); margin: 6px 0 6px; text-wrap: balance; }
  [data-theme="dark"] h1 { color: var(--ink); }
  .sub { color: var(--ink-2); font-family: var(--serif); font-size: 17px; margin: 0 0 24px; max-width: 62ch; text-wrap: pretty; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--hair); background: var(--panel); color: var(--navy); border-radius: 9px; padding: 10px 16px; font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; white-space: nowrap; }
  [data-theme="dark"] .btn { color: var(--ink); }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: var(--navy); }
  .btn.gold:hover { background: var(--gold-2); }
  .btn:hover { border-color: var(--gold); }
  .btn.sm { padding: 7px 12px; font-size: 10.5px; }
  .rule { display: flex; align-items: center; gap: 14px; margin: 30px 0 14px; }
  .rule::before { content: ""; width: 34px; height: 2px; background: var(--gold); }
  .rule::after { content: ""; flex: 1; height: 1px; background: var(--hair); }
  .rule span { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .rule .cnt { font-variant-numeric: tabular-nums; color: var(--ink-2); }

  /* today card */
  .today { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 20px; display: grid; grid-template-columns: 96px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 700px) { .today { grid-template-columns: 1fr; } }
  .score { background: var(--navy); color: #f3f1ea; border-radius: 10px; padding: 12px 8px 10px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
  .score .n { font-size: 34px; font-weight: 700; line-height: .95; font-variant-numeric: tabular-nums; }
  .score .d { font-size: 8.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-2); margin-top: 6px; }
  .score .tier { margin-top: 8px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: #fff; background: rgba(255,255,255,.1); border-radius: 6px; padding: 4px 0; }
  .today h2 { font-family: var(--serif); font-weight: 500; font-size: 22px; margin: 2px 0 0; color: var(--navy); letter-spacing: -.01em; }
  [data-theme="dark"] .today h2 { color: var(--ink); }
  .today .meta { font-size: 12.5px; color: var(--muted); font-style: italic; font-family: var(--serif); }
  .today .deck { font-family: var(--serif); font-size: 14.5px; line-height: 1.5; margin: 8px 0 10px; color: var(--ink); max-width: 72ch; text-wrap: pretty; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px 18px; margin-bottom: 10px; }
  .facts div { font-size: 10px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
  .facts div b { display: block; color: var(--navy); font-size: 13px; letter-spacing: 0; text-transform: none; margin-top: 2px; }
  [data-theme="dark"] .facts div b { color: var(--ink); }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .badge { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; border-radius: 6px; padding: 4px 9px; white-space: nowrap; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); } .badge.info { background: var(--info-bg); color: var(--info); }
  .badge.navy { background: var(--navy); color: var(--gold-2); } .badge.mute { background: var(--panel-2); color: var(--muted); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }

  /* tiles */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 760px) { .tiles { grid-template-columns: 1fr; } }
  .tile { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--radius); padding: 22px 24px; display: flex; flex-direction: column; gap: 6px; min-height: 160px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .tile::after { content: ""; position: absolute; right: -30px; top: -30px; width: 110px; height: 110px; border-radius: 50%; background: var(--panel-2); z-index: 0; }
  .tile > * { position: relative; z-index: 1; }
  .tile:hover { border-color: var(--gold); }
  .tile .k { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold-deep); font-weight: 600; }
  .tile .n { font-size: 42px; font-weight: 700; color: var(--navy); line-height: 1; font-variant-numeric: tabular-nums; }
  [data-theme="dark"] .tile .n { color: var(--ink); }
  .tile .t { font-family: var(--serif); color: var(--ink-2); font-size: 14px; }
  .tile .go { margin-top: auto; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; color: var(--navy); }
  [data-theme="dark"] .tile .go { color: var(--gold-2); }

  /* toolbar + tables */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 0 0 14px; position: sticky; top: 66px; z-index: 5; background: var(--ground); padding: 8px 0; }
  .toolbar input, .toolbar select { font: inherit; font-size: 13px; padding: 9px 12px; border: 1px solid var(--hair); border-radius: 9px; background: var(--panel); color: var(--ink); min-width: 220px; }
  .seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 9px; overflow: hidden; background: var(--panel); }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 9px 14px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
  .seg button.on { background: var(--navy); color: var(--gold-2); }
  .tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--hair); border-radius: var(--radius); box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 14px 16px; border-bottom: 1px solid var(--hair); white-space: nowrap; background: var(--panel); }
  td { padding: 13px 16px; border-bottom: 1px solid var(--hair); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  tr.row:hover td { background: var(--panel-2); cursor: pointer; }
  td.num { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--navy); white-space: nowrap; }
  [data-theme="dark"] td.num { color: var(--ink); }
  td.co { font-weight: 600; color: var(--navy); min-width: 240px; }
  [data-theme="dark"] td.co { color: var(--ink); }
  td .sm { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; line-height: 1.4; max-width: 46ch; }
  .date { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  .empty { padding: 40px; text-align: center; color: var(--muted); font-family: var(--serif); }
  .note { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 12px 16px; font-size: 13px; margin-bottom: 16px; }
  .note.info { background: var(--info-bg); color: var(--info); }

  /* sponsors */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  @media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { background: var(--panel); border: 1px solid var(--hair); border-radius: 12px; padding: 14px 16px; }
  .kpi .k { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .kpi .n { font-size: 28px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
  [data-theme="dark"] .kpi .n { color: var(--ink); }
  .teamnav { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
  .teamnav a { font-size: 11.5px; letter-spacing: .06em; padding: 7px 12px; border: 1px solid var(--hair); border-radius: 999px; background: var(--panel); color: var(--ink-2); }
  .teamnav a:hover { border-color: var(--gold); color: var(--navy); }
  .teamblock { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--radius); margin-bottom: 14px; box-shadow: var(--shadow); overflow: hidden; scroll-margin-top: 140px; }
  .teamblock summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 16px 22px; }
  .teamblock summary::-webkit-details-marker { display: none; }
  .teamblock summary .chev { width: 18px; height: 18px; color: var(--muted); transition: transform .15s; flex: none; }
  .teamblock[open] summary .chev { transform: rotate(90deg); }
  .teamblock summary .tn { font-weight: 600; color: var(--navy); font-size: 16px; }
  [data-theme="dark"] .teamblock summary .tn { color: var(--ink); }
  .teamblock summary .ti { font-family: var(--serif); font-style: italic; color: var(--muted); font-size: 13px; }
  .teamblock summary .stats { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .teamblock[open] summary { border-bottom: 1px solid var(--hair); }
  .teamblock .open-cats { padding: 12px 22px 0; font-size: 13px; color: var(--muted); }
  .teamblock .tablewrap { border: 0; border-radius: 0; box-shadow: none; }
  .cat { display: inline-block; font-size: 11px; background: var(--panel-2); border-radius: 5px; padding: 3px 8px; color: var(--ink-2); }
  .catgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .catcard { background: var(--panel); border: 1px solid var(--hair); border-radius: 12px; padding: 14px 16px; }
  .catcard .k { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-deep); font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .catcard ul { list-style: none; margin: 0; padding: 0; }
  .catcard li { font-size: 13px; padding: 5px 0; border-bottom: 1px dashed var(--hair); display: flex; justify-content: space-between; gap: 10px; }
  .catcard li:last-child { border-bottom: 0; }
  .catcard li span:last-child { color: var(--muted); text-align: right; }

  /* verification panel */
  .vpanel { border: 1px solid var(--hair); border-radius: 12px; background: var(--panel-2); padding: 14px 18px; margin: 0 0 18px; font-family: var(--sans); font-size: 13.5px; }
  .vpanel .vhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .vpanel .vhead .k { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-deep); font-weight: 600; }
  .vpanel .vhead .sm { color: var(--muted); font-size: 12px; }
  .vpanel .vrow { display: grid; grid-template-columns: 130px 1fr; gap: 8px 14px; padding: 8px 0; border-top: 1px dashed var(--hair); }
  .vpanel .vk { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding-top: 3px; }
  .vpanel .vv { line-height: 1.5; }
  .vpanel .vv ul { margin: 4px 0 0; padding-left: 18px; }
  .vpanel .vv a { text-decoration: underline; text-underline-offset: 3px; color: var(--navy); }
  [data-theme="dark"] .vpanel .vv a { color: var(--gold-2); }
  @media (max-width: 560px) { .vpanel .vrow { grid-template-columns: 1fr; gap: 4px; } }

  /* brief reader */
  details.screened { margin-top: 22px; }
  details.screened summary { cursor: pointer; list-style: none; }
  details.screened summary::-webkit-details-marker { display: none; }
  details.screened .rule { display: flex; }
  details.screened .sub { margin: 8px 0 10px; color: var(--muted); max-width: 80ch; }
  details.screened td.why { font-size: 12.5px; line-height: 1.45; max-width: 60ch; white-space: normal; }
  details.more { display: inline; }
  details.more summary { display: inline; cursor: pointer; color: var(--gold-ink, #8a6b34); font-size: 12px; text-decoration: underline dotted; }
  details.more[open] summary { display: block; margin-top: 4px; }
  .reader { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .reader iframe { width: 100%; height: calc(100vh - 210px); min-height: 720px; border: 0; background: #fbfaf7; }
  .detail { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--radius); padding: 26px 30px; box-shadow: var(--shadow); font-family: var(--serif); font-size: 16.5px; }
  .detail dl { display: grid; grid-template-columns: 170px 1fr; gap: 10px 16px; font-family: var(--sans); font-size: 13.5px; margin: 18px 0 0; }
  .detail dt { color: var(--muted); letter-spacing: .12em; text-transform: uppercase; font-size: 10.5px; padding-top: 3px; }
  .detail dd { margin: 0; }
  .detail dd a { text-decoration: underline; text-underline-offset: 3px; word-break: break-all; }
  .cta { margin-top: 22px; background: var(--navy); color: #f3f1ea; border-left: 5px solid var(--gold); border-radius: 0 12px 12px 0; padding: 18px 22px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; font-family: var(--sans); }
  .cta .k { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold-2); display: block; margin-bottom: 4px; font-weight: 600; }
  .cta p { margin: 0; font-size: 14px; max-width: 60ch; flex: 1; }
  .cta .btn { background: var(--gold); border-color: var(--gold); color: var(--navy); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--panel-2); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<header class="top">
  <button class="menu" id="menu" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a href="#/home" aria-label="1440 Sports home"><img class="logo light" src="__LOGO_BLUE_GOLD__" alt="1440 Sports"><img class="logo dark" src="__LOGO_WHITE__" alt="1440 Sports"></a>
  <span class="divider"></span><span class="product">Intelligence</span>
  <div class="right"><span id="mode"></span><span class="clock"><i></i><span id="clock">--:--:--</span></span></div>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="Sections">
    <div class="group">Dashboards</div>
    <a href="#/home" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="#/calendar" data-nav="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</a>
    <div class="group">Signals</div>
    <a href="#/signals/F1" data-nav="F1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l4-16h8l4 16M8 14h8"/></svg>Formula 1<span class="count" id="cF1"></span></a>
    <a href="#/signals/FE" data-nav="FE"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Formula E<span class="count" id="cFE"></span></a>
    <a href="#/signals/all" data-nav="all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>All signals<span class="count" id="cAll"></span></a>
    <div class="group">Grid</div>
    <a href="#/sponsors/F1" data-nav="sF1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>Sponsors · F1</a>
    <a href="#/sponsors/FE" data-nav="sFE"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>Sponsors · FE</a>
    <div class="user"><div class="av">TJ</div><div>Trushil Jani<small>Operator</small></div></div>

<form name="rebuild" netlify netlify-honeypot="bot-field" hidden><input name="company"><input name="date"><input name="label"><input name="bot-field"></form>
<script id="data" type="application/json">__DATA_JSON__</script>
<script>
(function () {
  'use strict';
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtDate = (iso) => { if (!iso) return ''; const d = new Date(iso.length === 10 ? iso + 'T00:00:00' : iso); return isNaN(d) ? esc(iso) : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };
  const verClass = (v) => v === 'verified' ? 'ok' : (v === 'needs_review' ? 'warn' : ((v === 'blocked' || v === 'contradicted') ? 'bad' : 'info'));
  const verLabel = (v) => ({ verified: 'Verified', needs_review: 'Check', blocked: 'Blocked', contradicted: 'Contradicted', pending: 'Pending' }[v] || v);
  const stLabel = (v) => ({ CONFIRMED: 'Confirmed', CORRECTED: 'Confirmed, corrected', NOT_FOUND: 'Not confirmed', CONTRADICTED: 'Contradicted', CHANGED: 'Changed', NA: 'None named', NONE_FOUND: 'None found', EXISTING_PARTNER: 'Existing partner', REPORTED_TALKS: 'Reported talks', OTHER_MOTORSPORT: 'Other motorsport' }[v] || v || '—');
  const stClass = (v) => ({ CONFIRMED: 'ok', CORRECTED: 'warn', NOT_FOUND: 'warn', CONTRADICTED: 'bad', CHANGED: 'warn', NA: 'mute', NONE_FOUND: 'ok', EXISTING_PARTNER: 'navy', REPORTED_TALKS: 'info', OTHER_MOTORSPORT: 'info' }[v] || 'mute');
  const link = (u) => u ? `<a href="${esc(u)}" target="_blank" rel="noreferrer noopener">${esc(u.replace(/^https?:\/\/(www\.)?/, '').slice(0, 70))}${u.length > 78 ? '…' : ''}</a>` : '';

  let D = null;
  function load() {
    const raw = $('#data').textContent.trim();
    if (raw && raw !== '__DATA' + '_JSON__') { D = JSON.parse(raw); boot(); return; }
    fetch('data.json').then((r) => r.json()).then((d) => { D = d; boot(); }).catch(() => { $('#main').innerHTML = '<p class="empty">No data.json next to this page yet. Run <code>python -m intel.site_export --out site/</code>.</p>'; });
  }

  // ---- data ----
  const all = () => D.briefs || [];
  const live = () => all().filter((b) => b.review.status === 'keep' || b.review.status === 'keep_flagged');
  const bySeries = (s) => live().filter((b) => b.series === s);
  const teamDisplay = (t) => (D.team_display && D.team_display[t]) || t;
  const teamsFor = (series) => (D.teams || []).filter((t) => t.series === series);
  const onNetlify = () => /netlify\.app$|1440sports\.com$/.test(location.hostname);
  function bindRebuild() {
    document.querySelectorAll('[data-rebuild]').forEach((btn) => btn.addEventListener('click', () => requestRebuild(btn.dataset.rebuild)));
  }
  async function requestRebuild(number) {
    const b = all().find((x) => String(x.number) === String(number));
    if (!b) return;
    const panel = $('#reqpanel');
    panel.hidden = false;
    const api = (D.desk_api || '').replace(/\/$/, '');
    if (!api) {
      if (onNetlify()) {
        try {
          const body = new URLSearchParams({ 'form-name': 'rebuild', company: b.company, date: b.date, label: b.label });
          const r = await fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body });
          if (r.ok) { panel.innerHTML = `<div class="note info" style="margin-top:16px"><b>Queued.</b> The next daily run builds the full case for ${esc(b.company)} and it appears here.</div>`; return; }
        } catch (e) { /* fall through */ }
      }
      const per = Number(D.backlog_per_run || 0), n = Number(b.backlog_position || 0);
      const nights = per > 0 && n > 0 ? Math.ceil(n / per) : 0;
      const eta = nights ? new Date(Date.now() + nights * 86400000).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '';
      panel.innerHTML = `<div class="note info" style="margin-top:16px"><b>In the automatic build queue.</b> Every signal is being turned into a full case by the desk itself, newest first. ${esc(b.company)} is number ${n || '?'} of ${esc(D.backlog_size || '?')} still to build${per ? ` at ${per} a night` : ''}${eta ? `, so it lands by about ${esc(eta)}` : ''}; a bulk build brings that forward. Nothing to do here.</div>`;
      return;
    }
    panel.innerHTML = `<div class="note info" style="margin-top:16px"><b>Starting…</b> Asking the desk to build the full case for ${esc(b.company)}.</div>`;
    let req;
    try {
      const r = await fetch(api + '/build', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ number: Number(number) }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { panel.innerHTML = `<div class="note" style="margin-top:16px"><b>Not started.</b> ${esc(j.detail || ('HTTP ' + r.status))}</div>`; return; }
      req = j.request;
    } catch (e) {
      panel.innerHTML = `<div class="note" style="margin-top:16px"><b>Not reachable.</b> The desk build service did not answer (${esc(String(e))}). Try again in a minute.</div>`;
      return;
    }
    const render = (q) => {
      const st = q.status;
      const msg = st === 'done' ? `<b>Built.</b> ${esc(b.company)} is now a full case${q.result_number ? ' (N° ' + esc(q.result_number) + ')' : ''}. <a href="#" id="reloadnow">Reload the app</a> to open it.`
        : st === 'failed' ? `<b>Build failed.</b> ${esc(q.error || 'The pipeline could not verify or render this case. The daily job will retry.')}`
        : st === 'running' ? `<b>Building…</b> Live research, claim-by-claim verification, the 13-rule audit, then the 2-page PDF and the long-form page. About five minutes.`
        : `<b>Queued.</b> Another case is being built first; yours starts right after.`;
      panel.innerHTML = `<div class="note ${st === 'failed' ? '' : 'info'}" style="margin-top:16px">${msg}</div>`;
      const rl = $('#reloadnow');
      if (rl) rl.addEventListener('click', (ev) => { ev.preventDefault(); location.reload(); });
    };
    render(req);
    const poll = async () => {
      try {
        const r = await fetch(api + '/build/' + req.id);
        if (r.ok) { const q = await r.json(); render(q); if (q.status === 'done' || q.status === 'failed') return; }
      } catch (e) { /* keep polling */ }
      setTimeout(poll, 15000);
    };
    setTimeout(poll, 15000);
  }

  // ---- views ----
  function tag(b) {
    const out = [];
    out.push(`<span class="badge ${verClass(b.verification)}">${verLabel(b.verification)}</span>`);
    if (b.review.status === 'keep_flagged') out.push('<span class="badge warn" title="' + esc(b.review.reason || '') + '">Check</span>');
    if (b.deal_update) out.push(`<span class="badge navy">Now partner · ${esc(teamDisplay(b.deal_update.team))}</span>`);
    if (b.check) {
      if (!b.deal_update && (b.check.motorsport_status || '') === 'EXISTING_PARTNER') out.push('<span class="badge navy">Existing partner</span>');
      if ((b.check.corrections && b.check.corrections.length) || b.check.person_status === 'CHANGED') out.push('<span class="badge warn">Corrected</span>');
      if (b.check.updates && b.check.updates.length) out.push(`<span class="badge info">${b.check.updates.length} update${b.check.updates.length > 1 ? 's' : ''}</span>`);
    }
    return out.join(' ');
  }

  function table(rows, opts) {
    opts = opts || {};
    if (!rows.length) return '<div class="tablewrap"><div class="empty">Nothing here yet.</div></div>';
    return `<div class="tablewrap"><table><thead><tr><th>Date</th><th>N°</th><th>Company</th><th>Series</th><th>Team</th><th>Score</th><th>Status</th></tr></thead><tbody>
      ${rows.map((b) => `<tr class="row" data-go="#/brief/${b.number}">
        <td class="date">${fmtDate(b.date)}</td>
        <td class="num">${esc(b.label)}</td>
        <td class="co">${esc(b.company)}<span class="sm">${esc(b.industry || b.trigger || '')}</span></td>
        <td>${esc(b.series || '—')}${b.series_inferred ? '<span class="sm">inferred</span>' : ''}</td>
        <td>${esc(teamDisplay(b.team) || '—')}</td>
        <td class="num">${b.score != null ? esc(b.score) : '—'}<span class="sm">${esc(b.tier || '')}</span></td>
        <td>${tag(b)}</td>
      </tr>`).join('')}
    </tbody></table></div>`;
  }

  function homeView() {
    const t = D.today;
    const f1 = bySeries('F1'), fe = bySeries('FE'), rows = live();
    const latest = (arr) => arr[0] ? `${esc(arr[0].company)} · ${fmtDate(arr[0].date)}` : 'nothing yet';
    let hero = '<div class="today"><div class="empty" style="grid-column:1/-1">No verified signal has been issued yet.</div></div>';
    if (t) {
      hero = `
      <div class="today">
        <div class="score"><div class="n">${esc(t.score)}</div><div class="d">Opportunity / 100</div><div class="tier">${esc(t.tier || '')}</div></div>
        <div>
          <div class="eyebrow">${t.date === (D.generated_at || '').slice(0, 10) ? "Today's signal" : 'Latest signal'} · ${esc(t.label)} · ${fmtDate(t.date)}</div>
          <h2>${esc(t.company)}</h2>
          <div class="meta">${esc(t.industry || '')}</div>
          <p class="deck">${esc(t.deck || t.take || '')}</p>
          <div class="facts">
            <div>Series<b>${esc(t.series || '—')}</b></div>
            <div>Recommended team<b>${esc(teamDisplay(t.team) || '—')}</b></div>
            <div>Decision-maker<b>${esc(t.person || '—')}${t.role ? ' · ' + esc(t.role) : ''}</b></div>
            <div>Action horizon<b>${esc(t.horizon || '—')}</b></div>
            ${t.trigger_date && t.trigger_date !== t.date ? `<div>Trigger date<b>${fmtDate(t.trigger_date)}</b></div>` : ''}
          </div>
          <div class="badges">
            <span class="badge ${verClass(t.verification)}">${verLabel(t.verification)}</span>
            <span class="badge ${t.audit === 'pass' || t.audit === 'pass_after_retry' ? 'ok' : 'warn'}">Audit ${esc(t.audit)}</span>
            ${t.confidence && t.confidence !== 'HIGH' ? `<span class="badge warn">Confidence ${esc(t.confidence)}</span>` : ''}
            ${(t.signals || []).map((s) => `<span class="badge info">${esc(s.replace(/_/g, ' '))}</span>`).join('')}
          </div>
          <div class="actions">
            <a class="btn gold" href="#/brief/${t.number}">Read the full brief</a>${t.pdf_url ? `<a class="btn" href="${esc(t.pdf_url)}" target="_blank" rel="noopener">2-page PDF</a>` : ''}
          </div>
        </div>
      </div>`;
    }
    return `
      <div class="head"><div><div class="eyebrow">${esc(D.execution_mode || '')} · generated ${fmtDate((D.generated_at || '').slice(0, 10))}</div><h1>Home</h1><p class="sub">One verified signal a day: who to call, why now, which team. Open any signal to read the case.</p></div></div>
      ${hero}
      <div class="rule"><span>Signals</span></div>
      <div class="tiles">
        <a class="tile" href="#/signals/F1"><div class="k">Formula 1</div><div class="n">${f1.length}</div><div class="t">Latest: ${latest(f1)}</div><div class="go">Open F1 signals →</div></a>
        <a class="tile" href="#/signals/FE"><div class="k">Formula E</div><div class="n">${fe.length}</div><div class="t">Latest: ${latest(fe)}</div><div class="go">Open FE signals →</div></a>
        <a class="tile" href="#/signals/all"><div class="k">All signals</div><div class="n">${rows.length}</div><div class="t">Date-wise, back to ${fmtDate(rows[rows.length - 1] ? rows[rows.length - 1].date : '')}</div><div class="go">Open the log →</div></a>
      </div>
      <div class="rule"><span>Most recent</span></div>
      ${table(rows.slice(0, 8))}`;
  }

  function signalsView(series) {
    const title = series === 'all' ? 'All signals' : (series === 'F1' ? 'Formula 1 signals' : 'Formula E signals');
    const rows = series === 'all' ? live() : bySeries(series);
    const inferred = rows.filter((b) => b.series_inferred).length;
    const flagged = rows.filter((b) => b.review.status === 'keep_flagged').length;
    return `
      <div class="head"><div><div class="eyebrow">Signals</div><h1>${title}</h1><p class="sub">${rows.length} signals, newest first.${inferred ? ` ${inferred} older rows had no series recorded; theirs is inferred from the text and marked.` : ''}${flagged ? ` ${flagged} carry a "Check" tag: kept, but a detail needs a human look before they are pitched.` : ''}</p></div>
      </div>
      <div class="toolbar"><input id="q" type="search" placeholder="Search company, team, trigger…"><select id="tier"><option value="">All tiers</option><option>HOT TOP TIER</option><option>HOT</option><option>WARM</option></select><span class="seg"><button data-hist="all" class="on">All</button><button data-hist="live">Engine briefs</button><button data-hist="hist">Historical</button></span></div>
      <div id="list">${table(rows)}</div>
      ${screenedBlock(series)}`;
  }

  // Screen-outs decided by a full case check: the desk looked, verified, and chose not to
  // build — shown with the reason, because that judgment is part of the product.
  const screened = (series) => all().filter((b) => b.review.status === 'screened_out' && b.review.reason_code === 'case_screen' && (series === 'all' || b.series === series));
  function screenedBlock(series) {
    const rows = screened(series);
    if (!rows.length) return '';
    return `<details class="screened"><summary><span class="rule"><span>Screened out after a full check</span><span class="cnt">${rows.length}</span></span></summary>
      <p class="sub">Signals the desk researched in full and decided not to build into a case: the trigger was outside the 90-day window, was contradicted by the primary source, or the company already sits on the grid. Each carries the reason and the sources.</p>
      <div class="tablewrap"><table><thead><tr><th>Date</th><th>Company</th><th>Series</th><th>Verdict</th><th>Why</th></tr></thead><tbody>
      ${rows.map((b) => { const m = /^([a-z ]+):\s*/i.exec(b.review.reason || ''); const verdict = m ? m[1] : 'screened'; const why = m ? (b.review.reason || '').slice(m[0].length) : (b.review.reason || ''); const cut = why.search(/\.\s+[A-Z]/); const lead = cut > 40 && cut < why.length - 30 ? why.slice(0, cut + 1) : why; const rest = lead.length < why.length ? why.slice(lead.length).trim() : ''; const src = (b.review.sources || []).map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener">[${i + 1}]</a>`).join(' '); return `<tr>
        <td class="date">${fmtDate(b.date)}</td>
        <td class="co">${esc(b.company)}</td>
        <td>${esc(b.series || '—')}</td>
        <td><span class="badge warn">${esc(verdict)}</span></td>
        <td class="why">${esc(lead)}${rest ? ` <details class="more"><summary>full reasoning</summary>${esc(rest)}</details>` : ''}${src ? ' <span class="sm">' + src + '</span>' : ''}</td>
      </tr>`; }).join('')}
      </tbody></table></div></details>`;
  }


  function briefView(number) {
    const b = all().find((x) => String(x.number) === String(number));
    if (!b) return '<div class="head"><div><h1>Brief not found</h1></div></div>';
    const back = `#/signals/${b.series || 'all'}`;
    const head = `<div class="head"><div><div class="eyebrow">${esc(b.label)} · ${fmtDate(b.date)} · ${esc(b.series || '')}${b.series_inferred ? ' (inferred)' : ''}</div><h1>${esc(b.company)}</h1><div class="badges">${tag(b)}</div></div>
      <div class="actions"><a class="btn" href="${back}">← Back</a>${b.pdf_url ? `<a class="btn gold" href="${esc(b.pdf_url)}" target="_blank" rel="noopener">2-page PDF</a>` : ''}${b.page_html ? '' : `<button type="button" class="btn gold" data-rebuild="${b.number}">Build the full case</button>`}</div></div>`;
    if (b.page_html) {
      return head + `<div class="reader"><iframe title="Brief ${esc(b.label)} — ${esc(b.company)}" srcdoc="${esc(b.page_html)}"></iframe></div>`;
    }
    const checkNote = b.review.status === 'keep_flagged' ? `<div class="note"><b>Check before pitching.</b> ${esc(b.review.reason || '')}</div>` : '';
    const dealNote = b.deal_update ? `<div class="note info"><b>Update.</b> ${esc(b.company)} is now a ${esc(b.deal_update.status)} partner of ${esc(teamDisplay(b.deal_update.team))}${b.deal_update.season ? ' (' + esc(b.deal_update.season) + ' roster)' : ''}${b.deal_update.notes ? ' — ' + esc(b.deal_update.notes) : ''}. The lane this signal pointed at is no longer open; treat the row as a closed case.</div>` : '';
    return head + `<div class="detail">
      ${dealNote}${checkNote}
      ${b.check ? checkPanel(b) : (b.historical ? '<div class="note info">Historical signal imported from the previous system — a headline and a source, not yet checked. Build the full case to get the Crusoe-standard brief: live verification of every claim, the 13-rule audit, the 2-page PDF and this long-form page.</div>' : '')}
      <p>${esc(b.deck || b.take || 'No summary was stored for this signal.')}</p>
      ${b.bottom_line ? `<p><b>Bottom line.</b> ${esc(b.bottom_line)}</p>` : ''}
      <dl>
        <dt>Score</dt><dd>${esc(b.score != null ? b.score + ' / 100 · ' + (b.tier || '') : '—')}</dd>
        <dt>Team</dt><dd>${esc(teamDisplay(b.team) || '—')}</dd>
        <dt>Decision-maker</dt><dd>${esc(b.person || '—')}${b.role ? ' · ' + esc(b.role) : ''}</dd>
        <dt>Trigger date</dt><dd>${b.trigger_date ? fmtDate(b.trigger_date) : '—'}</dd>
        <dt>Horizon</dt><dd>${esc(b.horizon || '—')}</dd>
        <dt>Source</dt><dd>${b.source_url ? `<a href="${esc(b.source_url)}" target="_blank" rel="noreferrer noopener">${esc(b.source_url)}</a>` : '—'}</dd>
        ${b.also_surfaced && b.also_surfaced.length ? `<dt>Also surfaced</dt><dd>${b.also_surfaced.map(fmtDate).join(' · ')} — folded into this case</dd>` : ''}
      </dl>
      ${b.deal_update ? '' : `<div class="cta"><div><span class="k">Full case</span><p>One click builds the Crusoe-standard case for ${esc(b.company)}: live research, claim-by-claim verification, the 13-rule audit, the 2-page PDF and the long-form page. About five minutes.</p></div><button type="button" class="btn" data-rebuild="${b.number}">Build the full case</button></div>`}
      <div id="reqpanel" hidden></div>
    </div>`;
  }

  function checkPanel(b) {
    const c = b.check;
    const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } };
    const src = c.evidence_url ? `<a href="${esc(c.evidence_url)}" target="_blank" rel="noreferrer noopener">${esc(host(c.evidence_url))}</a>` : '';
    const partner = b.partner_note ? `<div class="note"><b>Existing partner.</b> ${esc(b.partner_note)}</div>` : '';
    const rows = [];
    if (c.trigger_status === 'CONFIRMED' || c.trigger_status === 'CORRECTED') {
      rows.push(`<div class="vrow"><div class="vk">${c.trigger_status === 'CORRECTED' ? 'Verified, corrected' : 'Verified'}</div><div class="vv">${esc(c.evidence_excerpt || '')}${src ? ' · ' + src : ''}</div></div>`);
      if (c.corrections && c.corrections.length) rows.push(`<div class="vrow"><div class="vk">Corrections</div><div class="vv"><ul>${c.corrections.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div></div>`);
    } else if (c.trigger_status === 'CONTRADICTED') {
      rows.push(`<div class="vrow"><div class="vk">Contradicted</div><div class="vv">${esc(c.evidence_excerpt || c.notes || '')}${src ? ' · ' + src : ''}</div></div>`);
    } else {
      rows.push(`<div class="vrow"><div class="vk">Not confirmed</div><div class="vv">The trigger could not be confirmed against a primary source yet. ${esc(c.notes || '')}</div></div>`);
    }
    if (c.person_status === 'CHANGED') {
      rows.push(`<div class="vrow"><div class="vk">Decision-maker updated</div><div class="vv">${esc(c.person_note || '')}</div></div>`);
    } else if (c.person_status === 'NOT_FOUND') {
      rows.push(`<div class="vrow"><div class="vk">Decision-maker</div><div class="vv"><span class="badge warn">Not confirmed</span> ${esc(c.person_note || '')}</div></div>`);
    }
    if (c.motorsport_status && c.motorsport_status !== 'NONE_FOUND' && !b.partner_note) {
      rows.push(`<div class="vrow"><div class="vk">Motorsport</div><div class="vv"><span class="badge ${stClass(c.motorsport_status)}">${stLabel(c.motorsport_status)}</span> ${esc(c.motorsport_note || '')}</div></div>`);
    }
    if (c.updates && c.updates.length) {
      rows.push(`<div class="vrow"><div class="vk">Since then</div><div class="vv"><ul>${c.updates.slice(0, 3).map((u) => `<li><b>${esc(u.date || '')}</b> ${esc(u.event || '')}${u.url ? ' · <a href="' + esc(u.url) + '" target="_blank" rel="noreferrer noopener">' + esc(host(u.url)) + '</a>' : ''}</li>`).join('')}</ul></div></div>`);
    }
    return partner + `<div class="vpanel"><div class="vhead"><span class="k">Verification · ${esc(c.checked_at || '')}</span><span class="badge ${verClass(b.verification)}">${verLabel(b.verification)}</span></div>${rows.join('')}</div>`;
  }

  function sponsorsView(series) {
    const rows = (D.sponsors || []).filter((s) => s.series === series);
    const liveRows = rows.filter((s) => s.status === 'active' || s.status === 'joined');
    const withEnd = liveRows.filter((s) => s.until).length;
    const teams = {};
    liveRows.filter((s) => s.team).forEach((s) => { (teams[s.team] = teams[s.team] || []).push(s); });
    const champ = liveRows.filter((s) => !s.team);
    const profiles = {}; teamsFor(series).forEach((t) => { profiles[t.team] = t; });
    const cats = {};
    liveRows.filter((s) => s.category).forEach((s) => { (cats[s.category] = cats[s.category] || []).push(s); });
    const until = (s) => s.until ? `${esc(s.until)} <span class="sm">${s.until_kind === 'confirmed' ? 'confirmed' : 'reported'}</span>` : '<span class="sm">not stated</span>';
    const since = (s) => s.since ? esc(s.since) : `<span class="sm">${s.status === 'joined' ? 'new for ' : 'on the '}${esc(s.season || '')} roster</span>`;
    const rowsHtml = (list) => `<div class="tablewrap"><table><thead><tr><th>Brand</th><th>Category</th><th>Level</th><th>Status</th><th>Since</th><th>Until</th><th>Notes</th></tr></thead><tbody>
      ${list.map((s) => `<tr data-brand="${esc(s.brand.toLowerCase())}" data-cat="${esc((s.category || '').toLowerCase())}" data-level="${esc(s.level)}"><td class="co">${esc(s.brand)}</td><td>${s.category ? `<span class="cat">${esc(s.category)}</span>` : '<span class="sm">—</span>'}</td><td><span class="sm">${esc((s.level || '').replace(/_/g, ' '))}</span></td><td><span class="badge ${s.status === 'active' ? 'ok' : (s.status === 'joined' ? 'info' : 'mute')}">${esc(s.status)}</span></td><td class="num">${since(s)}</td><td class="num">${until(s)}</td><td><span class="sm">${esc(s.notes || '')}</span></td></tr>`).join('')}
    </tbody></table></div>`;
    const teamKeys = Object.keys(teams).sort((a, b) => teamDisplay(a).localeCompare(teamDisplay(b)));
    const slug = (t) => 'team-' + t.toLowerCase().replace(/[^a-z0-9]+/g, '-');
    const teamBlocks = teamKeys.map((team) => {
      const p = profiles[team] || {};
      const list = teams[team].sort((a, b) => (a.level || '').localeCompare(b.level || '') || a.brand.localeCompare(b.brand));
      const open = (p.open_categories || []).length ? `<span class="badge ok">${p.open_categories.length} open</span>` : '';
      const titles = list.filter((s) => s.level === 'team_title').map((s) => s.brand);
      return `<details class="teamblock" id="${slug(team)}"><summary><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg><span class="tn">${esc(teamDisplay(team))}</span><span class="ti">${esc(p.identity || '')}${titles.length ? ' · title: ' + esc(titles.join(', ')) : ''}</span><span class="stats"><span class="badge info">${list.length} partners</span>${open}</span></summary>
        ${p.open_categories && p.open_categories.length ? `<div class="open-cats">Documented open categories: ${p.open_categories.map(esc).join(' · ')}</div>` : ''}
        <div style="padding:12px 0 0">${rowsHtml(list)}</div></details>`;
    }).join('');
    const catCards = Object.keys(cats).sort().map((c) => `<div class="catcard"><div class="k"><span>${esc(c)}</span><span>${cats[c].length}</span></div><ul>${cats[c].map((s) => `<li><span>${esc(s.brand)}</span><span>${esc(s.team ? teamDisplay(s.team) : series + ' championship')}</span></li>`).join('')}</ul></div>`).join('');
    return `
      <div class="head"><div><div class="eyebrow">Grid</div><h1>${series === 'F1' ? 'Formula 1' : 'Formula E'} sponsors</h1><p class="sub">Every live partner on the ${series} grid, by team or by category, with when they joined and when the deal is reported to end. "Not stated" means no public end date, not an open-ended deal.</p></div><div class="actions"><span class="seg"><button class="on" data-view="team">By team</button><button data-view="category">By category</button></span></div></div>
      <div class="kpis"><div class="kpi"><div class="k">Teams</div><div class="n">${teamKeys.length}</div></div><div class="kpi"><div class="k">Live partners</div><div class="n">${liveRows.length}</div></div><div class="kpi"><div class="k">Joined this season</div><div class="n">${liveRows.filter((s) => s.status === 'joined').length}</div></div><div class="kpi"><div class="k">Reported end date</div><div class="n">${withEnd}</div></div></div>
      <div class="toolbar"><input id="sq" type="search" placeholder="Find a brand or category…"><select id="slevel"><option value="">All levels</option><option value="team_title">Team title</option><option value="team_major">Team partner</option><option value="powertrain">Powertrain</option><option value="championship_global">Championship global</option><option value="championship_official">Championship official</option></select><span class="seg"><button data-exp="open">Expand all</button><button data-exp="close">Collapse all</button></span></div>
      <div id="vteam">
        <div class="teamnav">${teamKeys.map((t) => `<a href="#${slug(t)}" data-jump="${slug(t)}">${esc(teamDisplay(t))}</a>`).join('')}</div>
        <div class="rule"><span>Championship-level partners</span><span class="cnt">${champ.length}</span></div>${rowsHtml(champ)}
        <div class="rule"><span>Teams</span><span class="cnt">${teamKeys.length}</span></div>${teamBlocks}
        <details class="teamblock"><summary><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg><span class="tn">Departed partners</span><span class="ti">kept for alumni and category context</span><span class="stats"><span class="badge mute">${rows.filter((s) => s.status === 'departed').length}</span></span></summary><div style="padding:12px 0 0">${rowsHtml(rows.filter((s) => s.status === 'departed'))}</div></details>
      </div>
      <div id="vcat" hidden><div class="rule"><span>Live partners by category</span><span class="cnt">${Object.keys(cats).length}</span></div><div class="catgrid">${catCards || '<div class="empty">No categorised partners.</div>'}</div></div>`;
  }

  function calendarView() {
    const cal = D.calendar || [];
    const f1 = cal.filter((c) => c.series === 'F1');
    const s12 = cal.filter((c) => c.series === 'FE' && c.season === 2026);
    const s13 = cal.filter((c) => c.series === 'FE' && c.season === 2027);
    const rows = (list) => `<div class="tablewrap"><table><thead><tr><th>Round</th><th>Race</th><th>Date</th><th>Title sponsor</th><th>Status</th></tr></thead><tbody>${list.map((c) => `<tr><td class="num">${esc(c.round)}</td><td class="co">${esc(c.name)}${c.city && !c.name.includes(c.city) ? ` · ${esc(c.city)}` : ''}${c.notes ? `<span class="sm">${esc(c.notes)}</span>` : ''}</td><td class="date">${c.date_start ? fmtDate(c.date_start) : '<span class="sm">date to confirm</span>'}</td><td>${esc(c.title_sponsor || '—')}</td><td><span class="badge ${c.status === 'confirmed' ? 'mute' : (c.status === 'confirmed' ? 'ok' : 'warn')}">${esc(c.status || '')}</span></td></tr>`).join('')}</tbody></table></div>`;
    return `
      <div class="head"><div><div class="eyebrow">Dashboards</div><h1>Calendar</h1><p class="sub">The rounds the engine is allowed to name. A race not on these lists blocks a brief, by design.</p></div></div>
      <div class="rule"><span>Formula E · Season 13 (2026-27) · GEN4 era</span><span class="cnt">${s13.length} races</span></div>${s13.length ? rows(s13) : '<div class="tablewrap"><div class="empty">Not loaded.</div></div>'}
      <div class="rule"><span>Formula 1 · 2026</span><span class="cnt">${f1.length} rounds</span></div>${rows(f1)}
      <div class="rule"><span>Formula E · Season 12 (2025-26) · completed</span><span class="cnt">${s12.length} races</span></div>${s12.length ? rows(s12) : '<div class="tablewrap"><div class="empty">Not loaded.</div></div>'}`;
  }

  // ---- router ----
  function route() {
    const hash = location.hash || '#/home';
    const parts = hash.slice(2).split('/');
    const main = $('#main');
    let nav = 'home';
    if (parts[0] === 'signals') { main.innerHTML = signalsView(parts[1] || 'all'); nav = parts[1] || 'all'; bindSignals(parts[1] || 'all'); }
    else if (parts[0] === 'brief') { main.innerHTML = briefView(parts[1]); const b = all().find((x) => String(x.number) === String(parts[1])); nav = b && b.series ? b.series : 'all'; bindRebuild(); }
    else if (parts[0] === 'sponsors') { main.innerHTML = sponsorsView(parts[1] || 'F1'); nav = 's' + (parts[1] || 'F1'); bindSponsors(); }
    else if (parts[0] === 'calendar') { main.innerHTML = calendarView(); nav = 'calendar'; }
    else { main.innerHTML = homeView(); }
    document.querySelectorAll('.side a[data-nav]').forEach((a) => a.classList.toggle('active', a.dataset.nav === nav));
    $('#side').classList.remove('open');
    if (!(parts[0] === 'sponsors' && location.hash.includes('team-'))) window.scrollTo(0, 0);
    bindRows();
  }
  function bindRows() { document.querySelectorAll('tr.row[data-go]').forEach((tr) => { tr.addEventListener('click', () => { location.hash = tr.dataset.go; }); }); }
  function bindSignals(series) {
    const base = series === 'all' ? live() : bySeries(series);
    let hist = 'all';
    const apply = () => {
      const q = ($('#q').value || '').toLowerCase();
      const tier = $('#tier').value;
      const rows = base.filter((b) => (!q || [b.company, b.team, b.trigger, b.industry, b.person].join(' ').toLowerCase().includes(q)) && (!tier || (b.tier || '') === tier) && (hist === 'all' || (hist === 'hist' ? b.historical : !b.historical)));
      $('#list').innerHTML = table(rows); bindRows();
    };
    $('#q').addEventListener('input', apply); $('#tier').addEventListener('change', apply);
    document.querySelectorAll('[data-hist]').forEach((b) => b.addEventListener('click', () => { hist = b.dataset.hist; document.querySelectorAll('[data-hist]').forEach((x) => x.classList.toggle('on', x === b)); apply(); }));
  }
  function bindSponsors() {
    document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => {
      document.querySelectorAll('[data-view]').forEach((x) => x.classList.toggle('on', x === b));
      $('#vteam').hidden = b.dataset.view !== 'team'; $('#vcat').hidden = b.dataset.view !== 'category';
    }));
    document.querySelectorAll('[data-exp]').forEach((b) => b.addEventListener('click', () => { document.querySelectorAll('.teamblock').forEach((d) => { d.open = b.dataset.exp === 'open'; }); }));
    document.querySelectorAll('[data-jump]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); const d = document.getElementById(a.dataset.jump); if (d) { d.open = true; d.scrollIntoView({ block: 'start' }); } }));
    const filter = () => {
      const q = ($('#sq').value || '').toLowerCase(); const lv = $('#slevel').value;
      document.querySelectorAll('#vteam tr[data-brand]').forEach((tr) => { tr.hidden = !((!q || tr.dataset.brand.includes(q) || tr.dataset.cat.includes(q)) && (!lv || tr.dataset.level === lv)); });
      if (q) document.querySelectorAll('.teamblock').forEach((d) => { d.open = !!d.querySelector('tr[data-brand]:not([hidden])'); });
    };
    $('#sq').addEventListener('input', filter); $('#slevel').addEventListener('change', filter);
  }

  function boot() {
    $('#cF1').textContent = bySeries('F1').length; $('#cFE').textContent = bySeries('FE').length; $('#cAll').textContent = live().length;
    $('#mode').textContent = (D.execution_mode || '') + ' mode';
    window.addEventListener('hashchange', route); route();
  }
  $('#menu').addEventListener('click', () => $('#side').classList.toggle('open'));
  const tick = () => { $('#clock').textContent = new Date().toLocaleTimeString('en-GB', { timeZone: 'Europe/London', hour12: false }); };
  tick(); setInterval(tick, 1000);
  load();
})();
</script>
</body>
</html>
