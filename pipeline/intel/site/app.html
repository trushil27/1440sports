<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1440 Intelligence Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@400;500;600;700&display=swap">
<style>
  /* 1440 Sports — Mission Control shell for the intelligence engine. Navy sidebar, gold actions,
     Poppins for the interface, Lora for anything a person reads as prose. */
  :root {
    --sans: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
    --serif: 'Lora', Georgia, serif;
    --navy: #191a48; --navy-2: #22245c; --navy-3: #2c2e6b; --gold: #c9a96a; --gold-2: #d1ae7a; --gold-deep: #9a7a3f;
    --ground: #f5f4ef; --panel: #ffffff; --panel-2: #f0eee8; --hair: #e2dfd6; --ink: #1a1c2e; --ink-2: #3f415b; --muted: #6f728a;
    --ok: #2f7d4f; --ok-bg: #e7f3ea; --warn: #9a6b1f; --warn-bg: #f8f0dd; --bad: #9a2f2f; --bad-bg: #f6e6e6; --info: #2f4f9a; --info-bg: #e6ebf6;
    --shadow: 0 1px 2px rgba(25,26,72,.05), 0 10px 30px -18px rgba(25,26,72,.25);
    --side-w: 264px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #101126; --panel: #171838; --panel-2: #1f2044; --hair: #2c2e58; --ink: #ece9df; --ink-2: #c9c6bd; --muted: #9d9fb8;
      --ok: #7fc59a; --ok-bg: #163021; --warn: #d9bc8a; --warn-bg: #33290f; --bad: #e08a8a; --bad-bg: #3a1a1a; --info: #9fb4ea; --info-bg: #1b2447;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    --ground: #101126; --panel: #171838; --panel-2: #1f2044; --hair: #2c2e58; --ink: #ece9df; --ink-2: #c9c6bd; --muted: #9d9fb8;
    --ok: #7fc59a; --ok-bg: #163021; --warn: #d9bc8a; --warn-bg: #33290f; --bad: #e08a8a; --bad-bg: #3a1a1a; --info: #9fb4ea; --info-bg: #1b2447;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.7);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* top bar */
  .top { position: sticky; top: 0; z-index: 20; height: 64px; background: var(--panel); border-bottom: 1px solid var(--hair); display: flex; align-items: center; gap: 18px; padding: 0 22px; }
  .top .wordmark { display: flex; align-items: center; gap: 14px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--navy); font-size: 15px; }
  [data-theme="dark"] .top .wordmark { color: var(--ink); }
  .top .wordmark .thin { font-weight: 400; color: var(--gold-deep); }
  .top .wordmark .bar { width: 1px; height: 22px; background: var(--hair); }
  .top .right { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .top .clock { background: var(--panel-2); border-radius: 999px; padding: 6px 14px; font-weight: 600; color: var(--navy); font-variant-numeric: tabular-nums; }
  [data-theme="dark"] .top .clock { color: var(--ink); }
  .top .clock i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 8px; }
  .menu { display: none; background: none; border: 0; padding: 6px; color: var(--navy); }
  [data-theme="dark"] .menu { color: var(--ink); }

  /* shell */
  .shell { display: grid; grid-template-columns: var(--side-w) 1fr; min-height: calc(100vh - 64px); }
  .side { background: linear-gradient(180deg, var(--navy-2), var(--navy)); color: #d8d6e6; padding: 26px 0 20px; display: flex; flex-direction: column; }
  .side .group { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #8f91b3; padding: 14px 28px 8px; }
  .side a { display: flex; align-items: center; gap: 14px; padding: 12px 28px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: #e7e5f1; border-left: 3px solid transparent; }
  .side a svg { width: 18px; height: 18px; flex: none; opacity: .85; }
  .side a:hover { background: rgba(255,255,255,.05); }
  .side a.active { background: rgba(255,255,255,.08); border-left-color: var(--gold); color: #fff; }
  .side a .count { margin-left: auto; font-size: 11px; background: rgba(255,255,255,.12); border-radius: 999px; padding: 2px 9px; letter-spacing: .04em; }
  .side .user { margin-top: auto; padding: 18px 28px 0; border-top: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 12px; font-size: 13px; }
  .side .user .av { width: 34px; height: 34px; border-radius: 50%; background: var(--gold); color: var(--navy); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  .side .user small { display: block; color: #9c9ec0; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }

  main { padding: 34px 40px 80px; max-width: 1180px; width: 100%; }
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: fixed; inset: 64px 0 0 0; z-index: 30; width: var(--side-w); transform: translateX(-100%); transition: transform .2s ease; }
    .side.open { transform: none; }
    .menu { display: inline-block; }
    main { padding: 22px 18px 60px; }
  }
  @media (prefers-reduced-motion: reduce) { .side { transition: none; } }

  /* page furniture */
  .eyebrow { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  h1 { font-family: var(--sans); font-weight: 600; font-size: 34px; letter-spacing: -.01em; color: var(--navy); margin: 4px 0 6px; text-wrap: balance; }
  [data-theme="dark"] h1 { color: var(--ink); }
  .sub { color: var(--ink-2); font-family: var(--serif); font-size: 17px; margin: 0 0 26px; max-width: 60ch; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--hair); background: var(--panel); color: var(--navy); border-radius: 8px; padding: 10px 16px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
  [data-theme="dark"] .btn { color: var(--ink); }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: var(--navy); }
  .btn.gold:hover { background: var(--gold-2); }
  .btn:hover { border-color: var(--gold); }
  .rule { display: flex; align-items: center; gap: 14px; margin: 26px 0 12px; }
  .rule::before { content: ""; width: 34px; height: 2px; background: var(--gold); }
  .rule::after { content: ""; flex: 1; height: 1px; background: var(--hair); }
  .rule span { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

  /* today card */
  .today { background: var(--panel); border: 1px solid var(--hair); border-radius: 14px; box-shadow: var(--shadow); padding: 26px 28px; display: grid; grid-template-columns: 150px 1fr; gap: 26px; }
  @media (max-width: 700px) { .today { grid-template-columns: 1fr; } }
  .score { background: var(--navy); color: #f3f1ea; border-radius: 12px; padding: 18px 16px 14px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
  .score .n { font-size: 54px; font-weight: 700; line-height: .9; font-variant-numeric: tabular-nums; }
  .score .d { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-2); margin-top: 8px; }
  .score .tier { margin-top: 12px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: #fff; background: rgba(255,255,255,.1); border-radius: 6px; padding: 5px 0; }
  .today h2 { font-family: var(--serif); font-weight: 500; font-size: 32px; margin: 4px 0 2px; color: var(--navy); }
  [data-theme="dark"] .today h2 { color: var(--ink); }
  .today .meta { font-size: 13px; color: var(--muted); font-style: italic; font-family: var(--serif); }
  .today .deck { font-family: var(--serif); font-size: 17px; line-height: 1.55; margin: 14px 0 16px; color: var(--ink); max-width: 62ch; }
  .facts { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-bottom: 18px; }
  .facts div { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
  .facts div b { display: block; color: var(--navy); font-size: 14px; letter-spacing: 0; }
  [data-theme="dark"] .facts div b { color: var(--ink); }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .badge { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; border-radius: 6px; padding: 4px 9px; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); } .badge.info { background: var(--info-bg); color: var(--info); }
  .badge.navy { background: var(--navy); color: var(--gold-2); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }

  /* tiles */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 760px) { .tiles { grid-template-columns: 1fr; } }
  .tile { background: var(--panel); border: 1px solid var(--hair); border-radius: 14px; padding: 20px 22px; display: flex; flex-direction: column; gap: 6px; min-height: 150px; box-shadow: var(--shadow); }
  .tile:hover { border-color: var(--gold); }
  .tile .k { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-deep); font-weight: 600; }
  .tile .n { font-size: 40px; font-weight: 700; color: var(--navy); line-height: 1; font-variant-numeric: tabular-nums; }
  [data-theme="dark"] .tile .n { color: var(--ink); }
  .tile .t { font-family: var(--serif); color: var(--ink-2); font-size: 14px; }
  .tile .go { margin-top: auto; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; color: var(--navy); }
  [data-theme="dark"] .tile .go { color: var(--gold-2); }

  /* lists / tables */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 0 0 14px; }
  .toolbar input, .toolbar select { font: inherit; font-size: 13px; padding: 9px 12px; border: 1px solid var(--hair); border-radius: 8px; background: var(--panel); color: var(--ink); min-width: 200px; }
  .seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel); color: var(--muted); padding: 9px 14px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
  .seg button.on { background: var(--navy); color: var(--gold-2); }
  .tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--hair); border-radius: 14px; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 14px 16px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--hair); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  tr.row:hover td { background: var(--panel-2); cursor: pointer; }
  td.num { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--navy); white-space: nowrap; }
  [data-theme="dark"] td.num { color: var(--ink); }
  td.co { font-weight: 600; color: var(--navy); }
  [data-theme="dark"] td.co { color: var(--ink); }
  td .sm { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  .date { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  .empty { padding: 40px; text-align: center; color: var(--muted); font-family: var(--serif); }

  /* sponsors */
  .teamblock { background: var(--panel); border: 1px solid var(--hair); border-radius: 14px; margin-bottom: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .teamblock summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 16px 20px; }
  .teamblock summary::-webkit-details-marker { display: none; }
  .teamblock summary .tn { font-weight: 600; color: var(--navy); font-size: 16px; }
  [data-theme="dark"] .teamblock summary .tn { color: var(--ink); }
  .teamblock summary .ti { font-family: var(--serif); font-style: italic; color: var(--muted); font-size: 13px; }
  .teamblock summary .stats { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .teamblock[open] summary { border-bottom: 1px solid var(--hair); }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  @media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { background: var(--panel); border: 1px solid var(--hair); border-radius: 12px; padding: 14px 16px; }
  .kpi .k { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .kpi .n { font-size: 28px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
  [data-theme="dark"] .kpi .n { color: var(--ink); }
  .cat { display: inline-block; font-size: 11px; background: var(--panel-2); border-radius: 5px; padding: 3px 8px; color: var(--ink-2); }
  .catgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .catcard { background: var(--panel); border: 1px solid var(--hair); border-radius: 12px; padding: 14px 16px; }
  .catcard .k { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-deep); font-weight: 600; margin-bottom: 8px; }
  .catcard li { font-size: 13px; padding: 4px 0; border-bottom: 1px dashed var(--hair); display: flex; justify-content: space-between; gap: 10px; }
  .catcard li:last-child { border-bottom: 0; }
  .catcard ul { list-style: none; margin: 0; padding: 0; }
  .catcard li span:last-child { color: var(--muted); text-align: right; }

  /* brief reader */
  .reader { background: var(--panel); border: 1px solid var(--hair); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .reader iframe { width: 100%; height: calc(100vh - 200px); min-height: 700px; border: 0; background: #fbfaf7; }
  .detail { background: var(--panel); border: 1px solid var(--hair); border-radius: 14px; padding: 24px 28px; box-shadow: var(--shadow); font-family: var(--serif); font-size: 16px; }
  .detail dl { display: grid; grid-template-columns: 160px 1fr; gap: 8px 16px; font-family: var(--sans); font-size: 13px; margin: 16px 0 0; }
  .detail dt { color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-size: 11px; padding-top: 3px; }
  .detail dd { margin: 0; }
  .note { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 12px 16px; font-size: 13px; margin-bottom: 16px; }
</style>
</head>
<body>
<header class="top">
  <button class="menu" id="menu" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a class="wordmark" href="#/home"><span>1440<span class="thin">Sports</span></span><span class="bar"></span><span>Intelligence</span></a>
  <div class="right"><span id="mode"></span><span class="clock"><i></i><span id="clock">--:--:--</span></span></div>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="Sections">
    <div class="group">Dashboards</div>
    <a href="#/home" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="#/calendar" data-nav="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</a>
    <div class="group">Signals</div>
    <a href="#/signals/F1" data-nav="F1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l4-16h8l4 16M8 14h8"/></svg>Formula 1<span class="count" id="cF1"></span></a>
    <a href="#/signals/FE" data-nav="FE"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Formula E<span class="count" id="cFE"></span></a>
    <a href="#/signals/all" data-nav="all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>All signals<span class="count" id="cAll"></span></a>
    <div class="group">Grid</div>
    <a href="#/sponsors/F1" data-nav="sF1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>Sponsors · F1</a>
    <a href="#/sponsors/FE" data-nav="sFE"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>Sponsors · FE</a>
    <div class="user"><div class="av">TJ</div><div>Trushil Jani<small>Operator</small></div></div>
  </nav>
  <main id="main"></main>
</div>

<script id="data" type="application/json">__DATA_JSON__</script>
<script>
(function () {
  'use strict';
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtDate = (iso) => { if (!iso) return ''; const d = new Date(iso + (iso.length === 10 ? 'T00:00:00' : '')); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };
  const tierClass = (t) => (t || '').startsWith('HOT') ? 'navy' : (t === 'WARM' ? 'warn' : 'info');
  const verClass = (v) => v === 'verified' ? 'ok' : (v === 'needs_review' ? 'warn' : (v === 'blocked' ? 'bad' : 'info'));
  const verLabel = (v) => ({ verified: 'Verified', needs_review: 'Review', blocked: 'Blocked', pending: 'Pending' }[v] || v);

  let D = null;
  function load() {
    const raw = $('#data').textContent.trim();
    if (raw && raw !== '__DATA' + '_JSON__') { D = JSON.parse(raw); boot(); return; }
    fetch('data.json').then((r) => r.json()).then((d) => { D = d; boot(); }).catch(() => { $('#main').innerHTML = '<p class="empty">No data.json next to this page yet. Run <code>python -m intel.site_export --out site/</code>.</p>'; });
  }

  // ---- data helpers ----
  const briefs = () => D.briefs || [];
  const bySeries = (s) => briefs().filter((b) => b.series === s);
  const teamsFor = (series) => (D.teams || []).filter((t) => t.series === series);

  // ---- views ----
  function homeView() {
    const t = D.today;
    const f1 = bySeries('F1'), fe = bySeries('FE'), all = briefs();
    const latest = (arr) => arr[0] ? `${esc(arr[0].company)} · ${fmtDate(arr[0].date)}` : 'nothing yet';
    let hero = '<div class="today"><div class="empty" style="grid-column:1/-1">No verified signal has been issued yet.</div></div>';
    if (t) {
      hero = `
      <div class="today">
        <div class="score"><div class="n">${esc(t.score)}</div><div class="d">Opportunity / 100</div><div class="tier">${esc(t.tier || '')}</div></div>
        <div>
          <div class="eyebrow">Today's signal · ${esc(t.label)} · ${fmtDate(t.date)}</div>
          <h2>${esc(t.company)}</h2>
          <div class="meta">${esc(t.industry || '')}</div>
          <p class="deck">${esc(t.deck || t.take || '')}</p>
          <div class="facts">
            <div>Series<b>${esc(t.series || '—')}</b></div>
            <div>Recommended team<b>${esc(t.team || '—')}</b></div>
            <div>Decision-maker<b>${esc(t.person || '—')}${t.role ? ' · ' + esc(t.role) : ''}</b></div>
            <div>Action horizon<b>${esc(t.horizon || '—')}</b></div>
          </div>
          <div class="badges">
            <span class="badge ${verClass(t.verification)}">${verLabel(t.verification)}</span>
            <span class="badge ${t.audit === 'pass' || t.audit === 'pass_after_retry' ? 'ok' : 'warn'}">Audit ${esc(t.audit)}</span>
            ${t.confidence && t.confidence !== 'HIGH' ? `<span class="badge warn">Confidence ${esc(t.confidence)}</span>` : ''}
            ${(t.signals || []).map((s) => `<span class="badge info">${esc(s.replace(/_/g, ' '))}</span>`).join('')}
          </div>
          <div class="actions">
            <a class="btn gold" href="#/brief/${t.number}">Read the full brief</a>
            ${t.source_url ? `<a class="btn" href="${esc(t.source_url)}" target="_blank" rel="noreferrer noopener">Trigger source</a>` : ''}
          </div>
        </div>
      </div>`;
    }
    const recent = all.slice(0, 8);
    return `
      <div class="head"><div><div class="eyebrow">${esc(D.execution_mode || '')} · generated ${fmtDate((D.generated_at || '').slice(0, 10))}</div><h1>Home</h1><p class="sub">One verified signal a day: who to call, why now, which team. Open a brief to read the full case.</p></div></div>
      ${hero}
      <div class="rule"><span>Signals</span></div>
      <div class="tiles">
        <a class="tile" href="#/signals/F1"><div class="k">Formula 1</div><div class="n">${f1.length}</div><div class="t">Latest: ${latest(f1)}</div><div class="go">Open F1 signals →</div></a>
        <a class="tile" href="#/signals/FE"><div class="k">Formula E</div><div class="n">${fe.length}</div><div class="t">Latest: ${latest(fe)}</div><div class="go">Open FE signals →</div></a>
        <a class="tile" href="#/signals/all"><div class="k">All signals</div><div class="n">${all.length}</div><div class="t">Every signal, date-wise, back to ${fmtDate(all[all.length - 1] ? all[all.length - 1].date : '')}</div><div class="go">Open the log →</div></a>
      </div>
      <div class="rule"><span>Most recent</span></div>
      ${table(recent)}`;
  }

  function table(rows) {
    if (!rows.length) return '<div class="tablewrap"><div class="empty">Nothing here yet.</div></div>';
    return `<div class="tablewrap"><table><thead><tr><th>Date</th><th>N°</th><th>Company</th><th>Series</th><th>Team</th><th>Score</th><th>Status</th></tr></thead><tbody>
      ${rows.map((b) => `<tr class="row" data-go="#/brief/${b.number}">
        <td class="date">${fmtDate(b.date)}</td>
        <td class="num">${esc(b.label)}</td>
        <td class="co">${esc(b.company)}<span class="sm">${esc(b.industry || b.trigger || '')}</span></td>
        <td>${esc(b.series || '—')}${b.series_inferred ? '<span class="sm">inferred</span>' : ''}</td>
        <td>${esc(b.team || '—')}</td>
        <td class="num">${b.score != null ? esc(b.score) : '—'}<span class="sm">${esc(b.tier || '')}</span></td>
        <td><span class="badge ${verClass(b.verification)}">${verLabel(b.verification)}</span>${b.historical ? ' <span class="badge info">Historical</span>' : ''}</td>
      </tr>`).join('')}
    </tbody></table></div>`;
  }

  function signalsView(series) {
    const title = series === 'all' ? 'All signals' : (series === 'F1' ? 'Formula 1 signals' : 'Formula E signals');
    const rows = series === 'all' ? briefs() : bySeries(series);
    const inferred = rows.filter((b) => b.series_inferred).length;
    return `
      <div class="head"><div><div class="eyebrow">Signals</div><h1>${title}</h1><p class="sub">${rows.length} signals, newest first. ${inferred ? inferred + ' historical rows had no series recorded; their series is inferred from the text and marked.' : ''}</p></div></div>
      <div class="toolbar"><input id="q" type="search" placeholder="Search company, team, trigger…"><select id="tier"><option value="">All tiers</option><option>HOT TOP TIER</option><option>HOT</option><option>WARM</option></select><span class="seg"><button data-hist="all" class="on">All</button><button data-hist="live">Engine briefs</button><button data-hist="hist">Historical</button></span></div>
      <div id="list">${table(rows)}</div>`;
  }

  function briefView(number) {
    const b = briefs().find((x) => String(x.number) === String(number));
    if (!b) return '<div class="head"><div><h1>Brief not found</h1></div></div>';
    const head = `<div class="head"><div><div class="eyebrow">${esc(b.label)} · ${fmtDate(b.date)} · ${esc(b.series || '')}</div><h1>${esc(b.company)}</h1></div>
      <div class="actions"><a class="btn" href="#/signals/${b.series || 'all'}">← Back</a>${b.source_url ? `<a class="btn" href="${esc(b.source_url)}" target="_blank" rel="noreferrer noopener">Trigger source</a>` : ''}</div></div>`;
    if (b.page_html) {
      return head + `<div class="reader"><iframe title="Brief ${esc(b.label)} — ${esc(b.company)}" srcdoc="${esc(b.page_html)}"></iframe></div>`;
    }
    return head + `<div class="detail">
      ${b.historical ? '<div class="note">Historical signal imported from the previous system — not re-verified by the engine.</div>' : ''}
      <p>${esc(b.deck || b.take || 'No summary was stored for this signal.')}</p>
      ${b.bottom_line ? `<p><b>Bottom line.</b> ${esc(b.bottom_line)}</p>` : ''}
      <dl>
        <dt>Score</dt><dd>${esc(b.score != null ? b.score + ' / 100 · ' + (b.tier || '') : '—')}</dd>
        <dt>Team</dt><dd>${esc(b.team || '—')}</dd>
        <dt>Decision-maker</dt><dd>${esc(b.person || '—')}${b.role ? ' · ' + esc(b.role) : ''}</dd>
        <dt>Trigger</dt><dd>${esc(b.trigger || '—')}${b.trigger_date ? ' · ' + fmtDate(b.trigger_date) : ''}</dd>
        <dt>Horizon</dt><dd>${esc(b.horizon || '—')}</dd>
        <dt>Verification</dt><dd><span class="badge ${verClass(b.verification)}">${verLabel(b.verification)}</span></dd>
        ${b.source_url ? `<dt>Source</dt><dd><a href="${esc(b.source_url)}" target="_blank" rel="noreferrer noopener" style="text-decoration:underline">${esc(b.source_url)}</a></dd>` : ''}
      </dl></div>`;
  }

  function sponsorsView(series) {
    const rows = (D.sponsors || []).filter((s) => s.series === series);
    const live = rows.filter((s) => s.status === 'active' || s.status === 'joined');
    const withEnd = live.filter((s) => s.until).length;
    const teams = {};
    live.filter((s) => s.team).forEach((s) => { (teams[s.team] = teams[s.team] || []).push(s); });
    const champ = live.filter((s) => !s.team);
    const profiles = {}; teamsFor(series).forEach((t) => { profiles[t.team] = t; });
    const cats = {};
    live.filter((s) => s.category).forEach((s) => { (cats[s.category] = cats[s.category] || []).push(s); });
    const until = (s) => s.until ? `${esc(s.until)} <span class="sm">${s.until_kind === 'confirmed' ? 'confirmed' : 'reported'}</span>` : '<span class="sm">not stated</span>';
    const since = (s) => s.since ? esc(s.since) : `<span class="sm">${s.status === 'joined' ? 'new for ' : 'on the '}${esc(s.season || '')} roster</span>`;
    const rowsHtml = (list) => `<div class="tablewrap"><table><thead><tr><th>Brand</th><th>Category</th><th>Level</th><th>Status</th><th>Since</th><th>Until</th><th>Notes</th></tr></thead><tbody>
      ${list.map((s) => `<tr><td class="co">${esc(s.brand)}</td><td>${s.category ? `<span class="cat">${esc(s.category)}</span>` : '<span class="sm">—</span>'}</td><td><span class="sm">${esc((s.level || '').replace(/_/g, ' '))}</span></td><td><span class="badge ${s.status === 'active' ? 'ok' : (s.status === 'joined' ? 'info' : 'warn')}">${esc(s.status)}</span></td><td class="num">${since(s)}</td><td class="num">${until(s)}</td><td><span class="sm">${esc(s.notes || '')}</span></td></tr>`).join('')}
    </tbody></table></div>`;
    const teamBlocks = Object.keys(teams).sort().map((team) => {
      const p = profiles[team] || {};
      const list = teams[team].sort((a, b) => (a.level || '').localeCompare(b.level || '') || a.brand.localeCompare(b.brand));
      const open = (p.open_categories || []).length ? `<span class="badge ok">${p.open_categories.length} documented open</span>` : '';
      return `<details class="teamblock"><summary><span class="tn">${esc(team)}</span><span class="ti">${esc(p.identity || '')}</span><span class="stats"><span class="badge info">${list.length} partners</span>${open}</span></summary>
        ${p.open_categories && p.open_categories.length ? `<div style="padding:12px 20px 0;font-size:13px;color:var(--muted)">Open categories: ${p.open_categories.map(esc).join(' · ')}</div>` : ''}
        <div style="padding:12px 0 0">${rowsHtml(list)}</div></details>`;
    }).join('');
    const catCards = Object.keys(cats).sort().map((c) => `<div class="catcard"><div class="k">${esc(c)}</div><ul>${cats[c].map((s) => `<li><span>${esc(s.brand)}</span><span>${esc(s.team || (series + ' championship'))}</span></li>`).join('')}</ul></div>`).join('');
    return `
      <div class="head"><div><div class="eyebrow">Grid</div><h1>${series === 'F1' ? 'Formula 1' : 'Formula E'} sponsors</h1><p class="sub">Every live partner on the ${series} grid, by team and by category, with when they joined and when the deal is reported to end. "Not stated" means no public end date, not an open-ended deal.</p></div><div class="actions"><span class="seg"><button class="on" data-view="team">By team</button><button data-view="category">By category</button></span></div></div>
      <div class="kpis"><div class="kpi"><div class="k">Teams</div><div class="n">${Object.keys(teams).length}</div></div><div class="kpi"><div class="k">Live partners</div><div class="n">${live.length}</div></div><div class="kpi"><div class="k">Joined for this season</div><div class="n">${live.filter((s) => s.status === 'joined').length}</div></div><div class="kpi"><div class="k">With a reported end date</div><div class="n">${withEnd}</div></div></div>
      <div id="vteam">
        <div class="rule"><span>Championship-level partners</span></div>${rowsHtml(champ)}
        <div class="rule"><span>Teams</span></div>${teamBlocks}
        <div class="rule"><span>Departed (kept for alumni context)</span></div>${rowsHtml(rows.filter((s) => s.status === 'departed'))}
      </div>
      <div id="vcat" hidden><div class="rule"><span>Live partners by category</span></div><div class="catgrid">${catCards || '<div class="empty">No categorised partners.</div>'}</div></div>`;
  }

  function calendarView() {
    const f1 = (D.calendar || []).filter((c) => c.series === 'F1');
    const fe = (D.calendar || []).filter((c) => c.series === 'FE');
    const rows = (list) => `<div class="tablewrap"><table><thead><tr><th>Round</th><th>Race</th><th>Date</th><th>Title sponsor</th><th>Status</th></tr></thead><tbody>${list.map((c) => `<tr><td class="num">${esc(c.round)}</td><td class="co">${esc(c.name)}${c.notes ? `<span class="sm">${esc(c.notes)}</span>` : ''}</td><td class="date">${c.date_start ? fmtDate(c.date_start) : '<span class="sm">date to confirm</span>'}</td><td>${esc(c.title_sponsor || '—')}</td><td><span class="badge ${c.status === 'confirmed' ? 'ok' : 'warn'}">${esc(c.status || '')}</span></td></tr>`).join('')}</tbody></table></div>`;
    return `
      <div class="head"><div><div class="eyebrow">Dashboards</div><h1>Calendar</h1><p class="sub">The rounds the engine is allowed to name. A race not on this list blocks a brief, by design.</p></div></div>
      <div class="rule"><span>Formula 1 · 2026 (${f1.length} rounds)</span></div>${rows(f1)}
      <div class="rule"><span>Formula E · Season 12 (2025-26)</span></div>${fe.length ? rows(fe) : '<div class="tablewrap"><div class="empty">The Season 12 round list is not loaded in the calendar table yet (17 races across 12 venues per the spec). Add it to <code>seeds/calendar_2026.json</code> from fiaformulae.com and the engine will start naming E-Prix rounds.</div></div>'}`;
  }

  // ---- router ----
  function route() {
    const hash = location.hash || '#/home';
    const parts = hash.slice(2).split('/');
    const main = $('#main');
    let nav = 'home';
    if (parts[0] === 'signals') { main.innerHTML = signalsView(parts[1] || 'all'); nav = parts[1] || 'all'; bindSignals(parts[1] || 'all'); }
    else if (parts[0] === 'brief') { main.innerHTML = briefView(parts[1]); const b = briefs().find((x) => String(x.number) === String(parts[1])); nav = b && b.series ? b.series : 'all'; }
    else if (parts[0] === 'sponsors') { main.innerHTML = sponsorsView(parts[1] || 'F1'); nav = 's' + (parts[1] || 'F1'); bindSponsors(); }
    else if (parts[0] === 'calendar') { main.innerHTML = calendarView(); nav = 'calendar'; }
    else { main.innerHTML = homeView(); }
    document.querySelectorAll('.side a[data-nav]').forEach((a) => a.classList.toggle('active', a.dataset.nav === nav));
    $('#side').classList.remove('open');
    window.scrollTo(0, 0);
    bindRows();
  }
  function bindRows() { document.querySelectorAll('tr.row[data-go]').forEach((tr) => { tr.addEventListener('click', () => { location.hash = tr.dataset.go; }); }); }
  function bindSignals(series) {
    const base = series === 'all' ? briefs() : bySeries(series);
    let hist = 'all';
    const apply = () => {
      const q = ($('#q').value || '').toLowerCase();
      const tier = $('#tier').value;
      const rows = base.filter((b) => (!q || [b.company, b.team, b.trigger, b.industry, b.person].join(' ').toLowerCase().includes(q)) && (!tier || (b.tier || '') === tier) && (hist === 'all' || (hist === 'hist' ? b.historical : !b.historical)));
      $('#list').innerHTML = table(rows); bindRows();
    };
    $('#q').addEventListener('input', apply); $('#tier').addEventListener('change', apply);
    document.querySelectorAll('[data-hist]').forEach((b) => b.addEventListener('click', () => { hist = b.dataset.hist; document.querySelectorAll('[data-hist]').forEach((x) => x.classList.toggle('on', x === b)); apply(); }));
  }
  function bindSponsors() {
    document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => {
      document.querySelectorAll('[data-view]').forEach((x) => x.classList.toggle('on', x === b));
      $('#vteam').hidden = b.dataset.view !== 'team'; $('#vcat').hidden = b.dataset.view !== 'category';
    }));
  }

  function boot() {
    $('#cF1').textContent = bySeries('F1').length; $('#cFE').textContent = bySeries('FE').length; $('#cAll').textContent = briefs().length;
    $('#mode').textContent = (D.execution_mode || '') + ' mode';
    window.addEventListener('hashchange', route); route();
  }
  $('#menu').addEventListener('click', () => $('#side').classList.toggle('open'));
  const tick = () => { $('#clock').textContent = new Date().toLocaleTimeString('en-GB', { timeZone: 'Europe/London', hour12: false }); };
  tick(); setInterval(tick, 1000);
  load();
})();
</script>
</body>
</html>
