[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intel"
version = "0.1.0"
description = "1440 Intelligence Platform — daily F1 / Formula E sponsorship-signal pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "anthropic>=0.40",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
# PDF rendering needs WeasyPrint's system libraries (Pango, Cairo, GDK-PixBuf).
render = ["weasyprint>=60", "pymupdf>=1.24"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "pymupdf>=1.24", "numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["intel*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["../engine", "../pitch"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["intel", "intel_api", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: Depends()/Query() in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.params.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
