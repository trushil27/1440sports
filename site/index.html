<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1440 Intelligence Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@400;500;600;700&display=swap">
<style>
  /* 1440 Sports — the intelligence engine in the Mission Control shell. Navy rail, gold
     actions, Poppins for the interface, Lora for prose. Brand marks are inlined below. */
  :root {
    --sans: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
    --serif: 'Lora', Georgia, serif;
    --navy: #191a48; --navy-2: #202261; --gold: #c9a96a; --gold-2: #d1ae7a; --gold-deep: #9a7a3f;
    --ground: #f4f3ee; --panel: #ffffff; --panel-2: #f2f0ea; --hair: #e3e0d8; --ink: #1a1c2e; --ink-2: #444660; --muted: #737590;
    --ok: #2f7d4f; --ok-bg: #e7f3ea; --warn: #9a6b1f; --warn-bg: #f8f0dd; --bad: #9a2f2f; --bad-bg: #f6e6e6; --info: #2f4f9a; --info-bg: #e6ebf6;
    --shadow: 0 1px 2px rgba(25,26,72,.05), 0 12px 32px -20px rgba(25,26,72,.3);
    --side-w: 272px; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0f1024; --panel: #171838; --panel-2: #1f2046; --hair: #2b2d57; --ink: #ece9df; --ink-2: #c9c6bd; --muted: #9d9fb8;
      --ok: #7fc59a; --ok-bg: #163021; --warn: #d9bc8a; --warn-bg: #33290f; --bad: #e08a8a; --bad-bg: #3a1a1a; --info: #9fb4ea; --info-bg: #1b2447;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -20px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0f1024; --panel: #171838; --panel-2: #1f2046; --hair: #2b2d57; --ink: #ece9df; --ink-2: #c9c6bd; --muted: #9d9fb8;
    --ok: #7fc59a; --ok-bg: #163021; --warn: #d9bc8a; --warn-bg: #33290f; --bad: #e08a8a; --bad-bg: #3a1a1a; --info: #9fb4ea; --info-bg: #1b2447;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -20px rgba(0,0,0,.8);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .side { transition: none !important; } }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .nc { color: var(--navy); } [data-theme="dark"] .nc { color: var(--ink); }

  /* top bar */
  .top { position: sticky; top: 0; z-index: 20; height: 66px; background: var(--panel); border-bottom: 1px solid var(--hair); display: flex; align-items: center; gap: 18px; padding: 0 24px; }
  .top .logo { height: 26px; width: auto; display: block; }
  .top .logo.dark { display: none; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .top .logo.light { display: none; } :root:not([data-theme="light"]) .top .logo.dark { display: block; } }
  :root[data-theme="dark"] .top .logo.light { display: none; } :root[data-theme="dark"] .top .logo.dark { display: block; }
  .top .divider { width: 1px; height: 26px; background: var(--hair); }
  .top .product { font-weight: 700; letter-spacing: .2em; text-transform: uppercase; font-size: 14px; color: var(--navy); }
  [data-theme="dark"] .top .product { color: var(--ink); }
  .top .right { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .top .clock { background: var(--panel-2); border-radius: 999px; padding: 7px 14px; font-weight: 600; color: var(--navy); font-variant-numeric: tabular-nums; letter-spacing: .06em; }
  [data-theme="dark"] .top .clock { color: var(--ink); }
  .top .clock i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 8px; }
  .menu { display: none; background: none; border: 0; padding: 6px; color: var(--navy); }
  [data-theme="dark"] .menu { color: var(--ink); }

  /* shell */
  .shell { display: grid; grid-template-columns: var(--side-w) 1fr; min-height: calc(100vh - 66px); }
  .side { background: linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 60%, #14153c 100%); color: #d8d6e6; padding: 28px 0 22px; display: flex; flex-direction: column; }
  .side .group { font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; color: #8f91b3; padding: 16px 30px 8px; }
  .side a { display: flex; align-items: center; gap: 14px; padding: 12px 30px; font-size: 12.5px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; color: #e7e5f1; border-left: 3px solid transparent; }
  .side a svg { width: 18px; height: 18px; flex: none; opacity: .8; }
  .side a:hover { background: rgba(255,255,255,.05); }
  .side a.active { background: rgba(255,255,255,.08); border-left-color: var(--gold); color: #fff; }
  .side a .count { margin-left: auto; font-size: 11px; background: rgba(255,255,255,.12); border-radius: 999px; padding: 2px 9px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .side .user { margin-top: auto; padding: 18px 30px 0; border-top: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 12px; font-size: 13px; }
  .side .user .av { width: 34px; height: 34px; border-radius: 50%; background: var(--gold); color: var(--navy); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  .side .user small { display: block; color: #9c9ec0; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; }
  .side .brand { padding: 0 30px 18px; }
  .side .brand img { height: 22px; opacity: .95; }

  main { padding: 36px 44px 90px; max-width: 1220px; width: 100%; }
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: fixed; inset: 66px 0 0 0; z-index: 30; width: var(--side-w); transform: translateX(-100%); transition: transform .2s ease; }
    .side.open { transform: none; }
    .menu { display: inline-block; }
    main { padding: 22px 18px 60px; }
  }

  /* page furniture */
  .eyebrow { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  h1 { font-family: var(--sans); font-weight: 600; font-size: 34px; letter-spacing: -.01em; color: var(--navy); margin: 6px 0 6px; text-wrap: balance; }
  [data-theme="dark"] h1 { color: var(--ink); }
  .sub { color: var(--ink-2); font-family: var(--serif); font-size: 17px; margin: 0 0 24px; max-width: 62ch; text-wrap: pretty; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--hair); background: var(--panel); color: var(--navy); border-radius: 9px; padding: 10px 16px; font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; white-space: nowrap; }
  [data-theme="dark"] .btn { color: var(--ink); }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: var(--navy); }
  .btn.gold:hover { background: var(--gold-2); }
  .btn:hover { border-color: var(--gold); }
  .btn.sm { padding: 7px 12px; font-size: 10.5px; }
  .rule { display: flex; align-items: center; gap: 14px; margin: 30px 0 14px; }
  .rule::before { content: ""; width: 34px; height: 2px; background: var(--gold); }
  .rule::after { content: ""; flex: 1; height: 1px; background: var(--hair); }
  .rule span { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .rule .cnt { font-variant-numeric: tabular-nums; color: var(--ink-2); }

  /* today card */
  .today { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; display: grid; grid-template-columns: 118px 1fr; gap: 20px; }
  @media (max-width: 700px) { .today { grid-template-columns: 1fr; } }
  .score { background: var(--navy); color: #f3f1ea; border-radius: 10px; padding: 14px 10px 12px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
  .score .n { font-size: 40px; font-weight: 700; line-height: .95; font-variant-numeric: tabular-nums; }
  .score .d { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-2); margin-top: 6px; }
  .score .tier { margin-top: 10px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: #fff; background: rgba(255,255,255,.1); border-radius: 6px; padding: 4px 0; }
  .today h2 { font-family: var(--serif); font-weight: 500; font-size: 26px; margin: 2px 0 0; color: var(--navy); letter-spacing: -.01em; }
  [data-theme="dark"] .today h2 { color: var(--ink); }
  .today .meta { font-size: 12.5px; color: var(--muted); font-style: italic; font-family: var(--serif); }
  .today .deck { font-family: var(--serif); font-size: 15px; line-height: 1.5; margin: 10px 0 12px; color: var(--ink); max-width: 70ch; text-wrap: pretty; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px 18px; margin-bottom: 12px; }
  .facts div { font-size: 10px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
  .facts div b { display: block; color: var(--navy); font-size: 13px; letter-spacing: 0; text-transform: none; margin-top: 2px; }
  [data-theme="dark"] .facts div b { color: var(--ink); }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .badge { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; border-radius: 6px; padding: 4px 9px; white-space: nowrap; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); } .badge.info { background: var(--info-bg); color: var(--info); }
  .badge.navy { background: var(--navy); color: var(--gold-2); } .badge.mute { background: var(--panel-2); color: var(--muted); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }

  /* tiles */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 760px) { .tiles { grid-template-columns: 1fr; } }
  .tile { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--radius); padding: 22px 24px; display: flex; flex-direction: column; gap: 6px; min-height: 160px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .tile::after { content: ""; position: absolute; right: -30px; top: -30px; width: 110px; height: 110px; border-radius: 50%; background: var(--panel-2); z-index: 0; }
  .tile > * { position: relative; z-index: 1; }
  .tile:hover { border-color: var(--gold); }
  .tile .k { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold-deep); font-weight: 600; }
  .tile .n { font-size: 42px; font-weight: 700; color: var(--navy); line-height: 1; font-variant-numeric: tabular-nums; }
  [data-theme="dark"] .tile .n { color: var(--ink); }
  .tile .t { font-family: var(--serif); color: var(--ink-2); font-size: 14px; }
  .tile .go { margin-top: auto; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; color: var(--navy); }
  [data-theme="dark"] .tile .go { color: var(--gold-2); }

  /* toolbar + tables */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 0 0 14px; position: sticky; top: 66px; z-index: 5; background: var(--ground); padding: 8px 0; }
  .toolbar input, .toolbar select { font: inherit; font-size: 13px; padding: 9px 12px; border: 1px solid var(--hair); border-radius: 9px; background: var(--panel); color: var(--ink); min-width: 220px; }
  .seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 9px; overflow: hidden; background: var(--panel); }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 9px 14px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
  .seg button.on { background: var(--navy); color: var(--gold-2); }
  .tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--hair); border-radius: var(--radius); box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 14px 16px; border-bottom: 1px solid var(--hair); white-space: nowrap; background: var(--panel); }
  td { padding: 13px 16px; border-bottom: 1px solid var(--hair); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  tr.row:hover td { background: var(--panel-2); cursor: pointer; }
  td.num { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--navy); white-space: nowrap; }
  [data-theme="dark"] td.num { color: var(--ink); }
  td.co { font-weight: 600; color: var(--navy); min-width: 240px; }
  [data-theme="dark"] td.co { color: var(--ink); }
  td .sm { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; line-height: 1.4; max-width: 46ch; }
  .date { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  .empty { padding: 40px; text-align: center; color: var(--muted); font-family: var(--serif); }
  .note { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 12px 16px; font-size: 13px; margin-bottom: 16px; }
  .note.info { background: var(--info-bg); color: var(--info); }

  /* sponsors */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  @media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { background: var(--panel); border: 1px solid var(--hair); border-radius: 12px; padding: 14px 16px; }
  .kpi .k { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .kpi .n { font-size: 28px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
  [data-theme="dark"] .kpi .n { color: var(--ink); }
  .teamnav { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
  .teamnav a { font-size: 11.5px; letter-spacing: .06em; padding: 7px 12px; border: 1px solid var(--hair); border-radius: 999px; background: var(--panel); color: var(--ink-2); }
  .teamnav a:hover { border-color: var(--gold); color: var(--navy); }
  .teamblock { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--radius); margin-bottom: 14px; box-shadow: var(--shadow); overflow: hidden; scroll-margin-top: 140px; }
  .teamblock summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 16px 22px; }
  .teamblock summary::-webkit-details-marker { display: none; }
  .teamblock summary .chev { width: 18px; height: 18px; color: var(--muted); transition: transform .15s; flex: none; }
  .teamblock[open] summary .chev { transform: rotate(90deg); }
  .teamblock summary .tn { font-weight: 600; color: var(--navy); font-size: 16px; }
  [data-theme="dark"] .teamblock summary .tn { color: var(--ink); }
  .teamblock summary .ti { font-family: var(--serif); font-style: italic; color: var(--muted); font-size: 13px; }
  .teamblock summary .stats { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .teamblock[open] summary { border-bottom: 1px solid var(--hair); }
  .teamblock .open-cats { padding: 12px 22px 0; font-size: 13px; color: var(--muted); }
  .teamblock .tablewrap { border: 0; border-radius: 0; box-shadow: none; }
  .cat { display: inline-block; font-size: 11px; background: var(--panel-2); border-radius: 5px; padding: 3px 8px; color: var(--ink-2); }
  .catgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .catcard { background: var(--panel); border: 1px solid var(--hair); border-radius: 12px; padding: 14px 16px; }
  .catcard .k { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-deep); font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .catcard ul { list-style: none; margin: 0; padding: 0; }
  .catcard li { font-size: 13px; padding: 5px 0; border-bottom: 1px dashed var(--hair); display: flex; justify-content: space-between; gap: 10px; }
  .catcard li:last-child { border-bottom: 0; }
  .catcard li span:last-child { color: var(--muted); text-align: right; }

  /* brief reader */
  .reader { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .reader iframe { width: 100%; height: calc(100vh - 210px); min-height: 720px; border: 0; background: #fbfaf7; }
  .detail { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--radius); padding: 26px 30px; box-shadow: var(--shadow); font-family: var(--serif); font-size: 16.5px; }
  .detail dl { display: grid; grid-template-columns: 170px 1fr; gap: 10px 16px; font-family: var(--sans); font-size: 13.5px; margin: 18px 0 0; }
  .detail dt { color: var(--muted); letter-spacing: .12em; text-transform: uppercase; font-size: 10.5px; padding-top: 3px; }
  .detail dd { margin: 0; }
  .detail dd a { text-decoration: underline; text-underline-offset: 3px; word-break: break-all; }
  .cta { margin-top: 22px; background: var(--navy); color: #f3f1ea; border-left: 5px solid var(--gold); border-radius: 0 12px 12px 0; padding: 18px 22px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; font-family: var(--sans); }
  .cta .k { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold-2); display: block; margin-bottom: 4px; font-weight: 600; }
  .cta p { margin: 0; font-size: 14px; max-width: 60ch; flex: 1; }
  .cta .btn { background: var(--gold); border-color: var(--gold); color: var(--navy); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--panel-2); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>

: tabular-nums; }\n  .scorebox .den { font-family: var(--sans); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-top: 8px; }\n  .chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }\n  @media (min-width: 640px) { .chips { grid-template-columns: repeat(4, 1fr); } }\n  .chip { border: 1px solid var(--hair); background: var(--panel); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; justify-content: center; }\n  .chip .k { font-family: var(--sans); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }\n  .chip .v { font-family: var(--sans); font-size: 15px; font-weight: 600; color: var(--navy); margin-top: 4px; line-height: 1.2; }\n  [data-theme=\"dark\"] .chip .v { color: var(--ink); }\n\n  /* sections */\n  section { margin: 0 0 38px; }\n  h2 { font-family: var(--sans); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-deep); margin: 0 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--hair); font-weight: 600; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }\n  [data-theme=\"dark\"] h2 { color: var(--gold); }\n  h2 .note { font-family: var(--sans); font-size: 11px; letter-spacing: .04em; text-transform: none; color: var(--muted); font-weight: 400; }\n  h2 .note.warn { color: var(--warn); }\n  p { margin: 0 0 12px; max-width: 40em; text-wrap: pretty; }\n  .hl { font-family: var(--sans); font-weight: 600; font-size: .9em; letter-spacing: .02em; color: var(--navy); }\n  [data-theme=\"dark\"] .hl { color: var(--gold); }\n\n  /* argument blocks: WHY NOW / WHY THIS TEAM / VALUE */\n  .args { display: grid; gap: 12px; grid-template-columns: 1fr; }\n  @media (min-width: 720px) { .args { grid-template-columns: repeat(2, 1fr); } }\n  .arg { background: var(--panel); border-radius: 10px; padding: 16px 18px 14px; border: 1px solid var(--hair); }\n  .arg .al { font-family: var(--sans); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-deep); font-weight: 600; margin-bottom: 6px; }\n  [data-theme=\"dark\"] .arg .al { color: var(--gold); }\n  .arg .at { font-size: 16px; line-height: 1.5; color: var(--ink); }\n  .clock { display: grid; gap: 0; grid-template-columns: 1fr; border-left: 2px solid var(--gold); padding-left: 0; }\n  .clock .tick { display: grid; grid-template-columns: 150px 1fr; gap: 14px; padding: 10px 0 10px 18px; border-bottom: 1px solid var(--hair); position: relative; }\n  .clock .tick::before { content: \"\"; position: absolute; left: -6px; top: 18px; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); border: 2px solid var(--paper); }\n  .clock .tick:last-child { border-bottom: 0; }\n  .clock .tl { font-family: var(--sans); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding-top: 3px; }\n  .clock .tt { font-size: 16px; line-height: 1.5; }\n  @media (max-width: 560px) { .clock .tick { grid-template-columns: 1fr; gap: 4px; } }\n  .ask { margin-top: 14px; background: var(--tile); color: var(--tile-ink); border-left: 4px solid var(--gold); border-radius: 0 10px 10px 0; padding: 14px 18px; font-size: 17px; line-height: 1.45; }\n  .ask .k { font-family: var(--sans); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); display: block; margin-bottom: 4px; }\n\n  /* ruled-out table */\n  .ruled { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 14px; }\n  .ruled th { font-family: var(--sans); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 6px 10px 8px 0; border-bottom: 1px solid var(--hair); font-weight: 600; }\n  .ruled td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--hair); vertical-align: top; }\n  .ruled td.t { font-weight: 600; color: var(--navy); white-space: nowrap; width: 34%; }\n  [data-theme=\"dark\"] .ruled td.t { color: var(--ink); }\n  .tablewrap { overflow-x: auto; }\n\n  /* proof points */\n  .proof { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }\n  @media (min-width: 640px) { .proof { grid-template-columns: repeat(3, 1fr); } }\n  .pf { background: var(--panel); border: 1px solid var(--hair); border-radius: 10px; padding: 14px 16px; }\n  .pf .pfv { font-family: var(--sans); font-size: 24px; font-weight: 700; color: var(--navy); line-height: 1.05; font-variant-numeric: tabular-nums; }\n  [data-theme=\"dark\"] .pf .pfv { color: var(--ink); }\n  .pf .pfv .dag { color: var(--warn); font-size: 14px; vertical-align: super; }\n  .pf .pfk { font-family: var(--sans); font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.35; }\n\n  /* grid fit */\n  .gfrow { display: grid; grid-template-columns: 1.4fr 110px 2fr; gap: 12px; align-items: center; padding: 10px 8px; border-bottom: 1px solid var(--hair); border-radius: 8px; }\n  .gfrow.rec { background: var(--panel); }\n  @media (max-width: 560px) { .gfrow { grid-template-columns: 1fr 110px; } .gfrow .gfd { grid-column: 1 / -1; } }\n  .gft { font-weight: 600; color: var(--navy); font-size: 16px; }\n  [data-theme=\"dark\"] .gft { color: var(--ink); }\n  .gft .star { display: block; font-family: var(--sans); font-size: 9.5px; letter-spacing: .16em; color: var(--gold-deep); font-weight: 600; margin-top: 2px; }\n  [data-theme=\"dark\"] .gft .star { color: var(--gold); }\n  .gflab { font-family: var(--sans); font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; text-align: center; padding: 5px 0; border-radius: 6px; }\n  .gflab.prime { background: var(--tile); color: var(--gold); }\n  .gflab.open { background: var(--ok-bg); color: var(--ok); }\n  .gflab.crowded { background: var(--warn-bg); color: var(--warn); }\n  .gflab.conflict { background: var(--bad-bg); color: var(--bad); }\n  .gfd { font-size: 14px; color: var(--ink-2); }\n\n  /* bottom line */\n  .bottomline { background: var(--tile); color: var(--tile-ink); border-left: 5px solid var(--gold); border-radius: 0 10px 10px 0; padding: 18px 22px; margin-top: 6px; }\n  .bottomline .k { font-family: var(--sans); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); font-weight: 600; }\n  .bottomline .t { font-size: 19px; line-height: 1.45; margin-top: 6px; }\n  .bottomline .hl { color: var(--gold); }\n  .flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }\n  .flag { font-family: var(--sans); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; background: var(--panel); border: 1px solid var(--hair); border-radius: 4px; padding: 4px 8px; color: var(--ink-2); }\n\n  /* decision maker + opening angle */\n  .twocol { display: grid; grid-template-columns: 1fr; gap: 20px; }\n  @media (min-width: 720px) { .twocol { grid-template-columns: 1fr 1fr; } }\n  .dm { border: 1px solid var(--hair); background: var(--panel); border-radius: 10px; padding: 16px 18px; }\n  .dm .name { font-size: 22px; color: var(--navy); font-weight: 500; }\n  [data-theme=\"dark\"] .dm .name { color: var(--ink); }\n  .dm .role { font-family: var(--sans); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 2px 0 10px; }\n  .dm .role .vtag { color: var(--ok); font-weight: 600; }\n  .dm .role .utag { color: var(--warn); font-weight: 600; }\n  .dm .bio { font-size: 15px; line-height: 1.5; }\n  .quote { background: var(--panel); border-left: 4px solid var(--gold); border-radius: 0 10px 10px 0; padding: 16px 18px; font-style: italic; font-size: 17px; line-height: 1.5; color: var(--navy); }\n  [data-theme=\"dark\"] .quote { color: var(--ink); }\n  .intro { font-size: 15px; color: var(--ink-2); margin-bottom: 10px; }\n\n  /* score composition */\n  .scoregrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }\n  @media (min-width: 720px) { .scoregrid { grid-template-columns: repeat(5, 1fr); } }\n  .sc { border: 1px solid var(--hair); border-radius: 10px; padding: 12px 14px; background: var(--panel); }\n  .sc .pill { font-family: var(--sans); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }\n  .sc .val { font-family: var(--sans); font-size: 24px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }\n  [data-theme=\"dark\"] .sc .val { color: var(--ink); }\n  .sc .val span { font-size: 12px; color: var(--muted); font-weight: 400; }\n  .sc .bar { height: 4px; background: var(--hair); border-radius: 2px; margin: 8px 0; overflow: hidden; }\n  .sc .bar i { display: block; height: 100%; background: var(--gold); }\n  .sc .why { font-size: 13px; color: var(--ink-2); line-height: 1.4; }\n\n  /* risks */\n  .risk { display: grid; grid-template-columns: 170px 1fr; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--hair); font-size: 15.5px; line-height: 1.5; }\n  @media (max-width: 560px) { .risk { grid-template-columns: 1fr; gap: 4px; } }\n  .risk .rt { font-family: var(--sans); font-weight: 600; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--navy); padding-top: 4px; }\n  [data-theme=\"dark\"] .risk .rt { color: var(--ink); }\n  .risk .rc b { font-family: var(--sans); font-size: .85em; letter-spacing: .04em; color: var(--gold-deep); }\n  [data-theme=\"dark\"] .risk .rc b { color: var(--gold); }\n\n  .sources { font-family: var(--sans); font-size: 12.5px; color: var(--muted); padding-left: 18px; margin: 0; word-break: break-all; line-height: 1.5; }\n  .sources li { margin-bottom: 4px; }\n  .sources a { text-decoration: none; }\n  .sources a:hover, .sources a:focus-visible { text-decoration: underline; }\n  .foot { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--hair); font-family: var(--sans); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; AAAAAAABkHAHQAAAAAAAAAAAACAQRBwBwAAAAAAAAAAAABgEATcAQAAAAAAAAAAAAAYBAF3AAAAAAAAAAAAAAAGQcAdAAAAAAAAAAAAAIBBEHAHAAAAAAAAAAAAAGAQBNwBAAAAAAAAAAAAABgEAXcAAAAAAAAAAAAAAAZBwB0AAAAAAAAAAAAAgEEQcAcAAAAAAAAAAAAAYBAE3AEAAAAAAAAAAAAAGAQBdwAAAAAAAAAAAAAABkHAHQAAAAAAAAAAAACAQRBwBwAAAAAAAAAAAABgEATcAQAAAAAAAAAAAAAYBAF3AAAAAAAAAAAAAAAGQcAdAAAAAAAAAAAAAIBBEHAHAAAAAAAAAAAAAGAQBNwBAAAAAAAAAAAAABgEAXcAAAAAAAAAAAAAAAZBwB0AAAAAAAAAAAAAgEEQcAcAAAAAAAAAAAAAYBAE3AEAAAAAAAAAAAAAGAQBdwAAAAAAAAAAAAAABkHAHQAAAAAAAAAAAACAQRBwBwAAAAAAAAAAAABgEATcAQAAAAAAAAAAAAAYBAF3AAAAAAAAAAAAAAAGQcAdAAAAAAAAAAAAAIBBEHAHAAAAAAAAAAAAAGAQBNwBAAAAAAAAAAAAABgEAXcAAAAAAAAAAAAAAAZBwB0AAAAAAAAAAAAAgEEQcAcAAAAAAAAAAAAAYBAE3AEAAAAAAAAAAAAAGAQBdwAAAAAAAAAAAAAABkHAHQAAAAAAAAAAAACAQRBwBwAAAAAAAAAAAABgEATcAQAAAAAAAAAAAAAYBAF3AAAAAAAAAAAAAAAGQcAdAAAAAAAAAAAAAIBBEHAHAAAAAAAAAAAAAGAQBNwBAAAAAAAAAAAAABgEAXcAAAAAAAAAAAAAAAZBwB0AAAAAAAAAAAAAgEEQcAcAAAAAAAAAAAAAYBAE3AEAAAAAAAAAAAAAGAQBdwAAAAAAAAAAAAAABkHAHQAAAAAAAAAAAACAQRBwBwAAAAAAAAAAAABgEATcAQAAAAAAAAAAAAAYBAF3AAAAAAAAAAAAAAAGQcAdAAAAAAAAAAAAAIBBEHAHAAAAAAAAAAAAAGAQBNwBAAAAAAAAAAAAABiE/w/8gOO6cxyfiAAAAABJRU5ErkJggg==\" alt=\"1440 Sports\">\n    <span class=\"meta\">Intelligence Brief · Confidential<br>N° 121 · 05 SEP 2026<\/span>\n  <\/div>\n  <div class=\"ribbon\">Intelligence Brief <span class=\"sep\">/<\/span> N° 121 <span class=\"sep\">·<\/span> HOT <span class=\"sep\">·<\/span> F1<\/div>\n\n  <h1>Crusoe<\/h1>\n  <div class=\"classline\">AI Infrastructure · GPU Cloud / Datacentre Builder · Denver, Colorado · Private (~$30B reported; $3B+ Series F, Sep 2026)<\/div>\n  <p class=\"lede\">Crusoe, the energy-first AI-infrastructure builder behind OpenAI's 1.2 GW Abilene campus, has reportedly closed a $3B+ Series F at a ~$30B valuation (Bloomberg, 3 Sep 2026), nearly tripling its October 2025 mark, days after a reported ~$13B five-year Jane Street cloud contract.<\/p>\n\n  <div class=\"strip\">\n    <div class=\"scorebox\"><div class=\"num\">80<\/div><div class=\"den\">Opportunity / 100<\/div><\/div>\n    <div class=\"chips\">\n      <div class=\"chip\"><div class=\"k\">Timing window<\/div><div class=\"v\">HOT<\/div><\/div>\n      <div class=\"chip\"><div class=\"k\">Series<\/div><div class=\"v\">F1<\/div><\/div>\n      <div class=\"chip\"><div class=\"k\">Recommended team<\/div><div class=\"v\">TGR Haas F1 Team<\/div><\/div>\n      <div class=\"chip\"><div class=\"k\">Action horizon<\/div><div class=\"v\">6-10 WKS<\/div><\/div>\n    <\/div>\n  <\/div>\n\n  <section>\n    <h2>The case<\/h2>\n    <p>Crusoe's reported $3B+ Series F at roughly $30B post-money, co-led by Atreides Management and Valor Equity Partners with Mubadala Capital participating, nearly triples the $10B+ valuation set by its $1.375B Series E in October 2025. The company builds and powers gigawatt-scale AI data centres - the first phase of the 1.2 GW Stargate campus in Abilene, Texas is live for Oracle and OpenAI - and sells GPU cloud to OpenAI, Microsoft and Meta. Bloomberg also reports a ~$13B, five-year AI-cloud contract with Jane Street, its highest-profile cloud customer yet.<\/p>\n<p>The grid has already proved this archetype buys F1: CoreWeave signed with Aston Martin Aramco in May 2025 as Official AI Cloud Computing Partner, and Core Scientific joined Cadillac for 2026. Crusoe's closest rival is on the grid and Crusoe is not, and no team carries a brand that owns both halves of the AI build-out, the power and the compute.<\/p>  <\/section>\n\n  <section>\n    <h2>Why now <span class=\"note\">— the clock this signal is on<\/span><\/h2>\n    <div class=\"clock\">\n      <div class=\"tick\"><div class=\"tl\">Trigger<\/div><div class=\"tt\">Bloomberg reported on 3 September that Crusoe closed more than $3B of Series F capital at roughly $30B post-money, co-led by Atreides Management and Valor Equity Partners with Mubadala Capital participating. That is close to three times the valuation set by its $1.375B Series E in October 2025, and it lands in the same week as a reported ~$13B, five-year AI-cloud contract with Jane Street.<\/div><\/div>\n      <div class=\"tick\"><div class=\"tl\">Budget authority<\/div><div class=\"tt\">A raise of this size resets the brand and marketing budget for the next 12 to 18 months. With OpenAI, Microsoft, Meta and now Jane Street already on the customer list, the next buyers Crusoe has to reach are enterprise CIOs, CFOs and the capital-markets audience ahead of a probable listing. That is the audience a Formula 1 partnership puts in the room.<\/div><\/div>\n      <div class=\"tick\"><div class=\"tl\">Calendar window<\/div><div class=\"tt\">The US GP in Austin (late October) and the Las Vegas GP (November) are the two remaining home-market races of 2026. A partnership agreed before Austin can be announced there and activated in full for 2027; teams close their 2027 partner rosters in the fourth quarter.<\/div><\/div>\n      <div class=\"tick\"><div class=\"tl\">Competitive clock<\/div><div class=\"tt\">CoreWeave, Crusoe's closest listed rival, has held the Official AI Cloud Computing Partner slot at Aston Martin Aramco since May 2025, and Core Scientific joined Cadillac for 2026. Fluidstack raised a reported $1.5B at an $18B valuation this week and is the next name likely to shop for a grid position. The open cloud-compute lanes will not stay open through 2027.<\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <section>\n    <h2>Proof points\n<span class=\"note\">— every figure checked against its source (see Sources)<\/span>\n    <\/h2>\n    <div class=\"proof\">\n      <div class=\"pf\"><div class=\"pfv\">$3B+<\/div><div class=\"pfk\">$3B+ Series F at ~$30B post-money, reported by Bloomberg 3 Sep 2026<\/div><\/div>\n      <div class=\"pf\"><div class=\"pfv\">$13B<\/div><div class=\"pfk\">Bloomberg also reports a ~$13B, five-year AI-cloud contract with Jane Street, its highest-profile cloud cus…<\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <section>\n    <h2>Why Tgr Haas F1 Team <span class=\"note\">— the open lane, the audience, the platform<\/span><\/h2>\n    <div class=\"args\">\n      <div class=\"arg\"><div class=\"al\">The open lane<\/div><div class=\"at\">Haas carries no cloud, GPU or AI-compute partner. Its technology roster is Toyota Gazoo Racing as title partner, Mphasis for digital services and RUCKUS Networks for networking, which leaves Official AI Cloud Compute Partner a clean, ownable category at a team-partner price rather than a title price.<\/div><\/div>\n      <div class=\"arg\"><div class=\"al\">Audience and market fit<\/div><div class=\"at\">Haas is the American privateer in a US-owned sport; Crusoe is a Denver company whose growth story (Abilene, Wyoming, Jane Street) is American. Austin and Las Vegas are US rounds still to come in 2026, and the team's guest lists at those events are the enterprise and capital-markets buyers Crusoe is selling to.<\/div><\/div>\n      <div class=\"arg\"><div class=\"al\">A team that will use the product<\/div><div class=\"at\">Haas is the grid's lean privateer, so it has the most to gain from elastic GPU capacity for simulation, strategy and analytics work. The partnership would be consumed in the factory, not just displayed on the car, which is what separates a technology partner from a logo.<\/div><\/div>\n      <div class=\"arg\"><div class=\"al\">Precedent and price<\/div><div class=\"at\">CoreWeave's Aston Martin deal proves a neocloud buys Formula 1. The Haas lane comes at a team-partner entry tier, an estimated $5-8M a year and part-payable in compute credits, with sidepod placement and naming of the team's compute environment. The precedent removes the category doubt; the price makes it an easy first commitment.<\/div><\/div>\n    <\/div>\n    <div style=\"margin-top:18px\">\n      <div class=\"gfrow rec\">\n        <div class=\"gft\">MoneyGram Haas F1 Team<span class=\"star\">◆ Recommended<\/span><\/div>\n        <div class=\"gflab open\">OPEN<\/div>\n        <div class=\"gfd\">no rival in this category lane<\/div>\n      <\/div>\n      <div class=\"gfrow \">\n        <div class=\"gft\">McLaren F1 Team<\/div>\n        <div class=\"gflab conflict\">TAKEN<\/div>\n        <div class=\"gfd\">Dell Technologies, Google Cloud, Schneider Electric<\/div>\n      <\/div>\n      <div class=\"gfrow \">\n        <div class=\"gft\">Aston Martin Aramco F1 Team<\/div>\n        <div class=\"gflab conflict\">TAKEN<\/div>\n        <div class=\"gfd\">CoreWeave, NetApp<\/div>\n      <\/div>\n      <div class=\"gfrow \">\n        <div class=\"gft\">Mercedes-AMG Petronas F1 Team<\/div>\n        <div class=\"gflab conflict\">TAKEN<\/div>\n        <div class=\"gfd\">Microsoft<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"tablewrap\">\n    <table class=\"ruled\">\n      <thead><tr><th>Ruled out<\/th><th>Why the lane is closed<\/th><\/tr><\/thead>\n      <tbody>\n      <tr><td class=\"t\">Aston Martin Aramco F1 Team<\/td><td>CoreWeave, Official AI Cloud Computing Partner since May 2025, is Crusoe's direct rival.<\/td><\/tr>\n      <tr><td class=\"t\">Cadillac F1 Team<\/td><td>Core Scientific (data-centre and HPC hosting) and TWG AI sit on the inaugural 2026 roster.<\/td><\/tr>\n      <tr><td class=\"t\">Oracle Red Bull Racing<\/td><td>Oracle is title partner and the cloud and compute incumbent.<\/td><\/tr>\n      <tr><td class=\"t\">Mercedes-AMG Petronas F1 Team<\/td><td>Microsoft holds the cloud lane.<\/td><\/tr>\n      <tr><td class=\"t\">McLaren F1 Team<\/td><td>Google Cloud, Dell Technologies and Schneider Electric occupy cloud, hardware and data-centre power.<\/td><\/tr>\n      <tr><td class=\"t\">BWT Alpine F1 Team<\/td><td>Microsoft holds the cloud lane.<\/td><\/tr>\n      <tr><td class=\"t\">Scuderia Ferrari<\/td><td>HP (title) and IBM cover compute hardware and cloud services.<\/td><\/tr>\n      <tr><td class=\"t\">Audi F1 Team · Racing Bulls · Williams<\/td><td>Lane open but not chosen: European rosters and audiences; Haas gives the US home-market platform the signal needs.<\/td><\/tr>\n      <\/tbody>\n    <\/table>\n    <\/div>\n  <\/section>\n\n  <section>\n    <h2>Value To Tgr Haas F1 Team <span class=\"note\">— Mode A · tech in the car / championship<\/span><\/h2>\n    <div class=\"args\">\n      <div class=\"arg\"><div class=\"al\">Operational workstream (Mode A)<\/div><div class=\"at\">Elastic GPU capacity for the work that sits outside the FIA's aerodynamic-testing restrictions: machine-learning surrogate models, driver-in-the-loop and race-strategy simulation, and telemetry and video analytics between sessions. Crusoe supplies capacity on demand; the team gets compute it could not fund inside the cost cap.<\/div><\/div>\n      <div class=\"arg\"><div class=\"al\">Commercial lift for the team<\/div><div class=\"at\">A partner that sells to CIOs and CFOs brings a guest list of enterprise buyers, investors and bankers to Austin and Las Vegas, the same audience Haas's other B2B partners (Mphasis, RUCKUS, MoneyGram) want in the suite. Crusoe's own customers, OpenAI, Microsoft, Meta and Jane Street, are a hospitality draw in their own right.<\/div><\/div>\n      <div class=\"arg\"><div class=\"al\">Content and ecosystem<\/div><div class=\"at\">An energy-to-compute story the team can tell on camera: a Denver company that turns power into AI capacity, running the race team's models. It gives Haas a technology narrative it does not currently own, and gives Crusoe a proof-of-value case study for enterprise sales.<\/div><\/div>\n      <div class=\"arg\"><div class=\"al\">What the team gives back<\/div><div class=\"at\">Official AI Cloud Compute Partner designation, sidepod or engine-cover placement, naming of the team's compute environment, hospitality at Austin and Las Vegas, driver and engineering access for Crusoe's enterprise channels, and a factory reference customer for Crusoe's cloud.<\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <section>\n    <h2>Deal architecture<\/h2>\n    <p>Entry as Official AI Cloud Compute Partner. <b class=\"hl\">THREE YEARS<\/b>, 2027-2029, spanning a probable listing window and three US-race cycles. Estimated $5-8M/yr, part-payable in compute credits. Scope: sidepod placement, naming of the team's compute environment, Austin and Las Vegas hospitality, co-produced engineering content.<\/p>\n    <div class=\"ask\"><span class=\"k\">The ask<\/span>A 25-minute call with Chase Lochmiller before the Las Vegas GP to confirm the Series F on the record, agree the Austin announcement window, and size the entry tier against Haas's 2027 partner roster.<\/div>\n  <\/section>\n\n  <section class=\"twocol\">\n    <div>\n      <h2>Primary decision-maker<\/h2>\n      <div class=\"dm\">\n        <div class=\"name\">Chase Lochmiller<\/div>\n        <div class=\"role\">CEO &amp; Co-Founder, Crusoe · <span class=\"vtag\">verified<\/span><\/div>\n        <div class=\"bio\">Lochmiller co-founded Crusoe in 2018 and fronts every raise and mega-contract; a deal of this scale is his call. Path: Sharieff Mansour, VP Marketing (sponsorship owner; reported), Cully Cavness, President and Chief Strategy Officer, and CTO Nitin Perumbeti on compute scope.<\/div>\n      <\/div>\n    <\/div>\n    <div>\n      <h2>Opening angle<\/h2>\n<div class=\"intro\">Lead with the Aston Martin precedent.<\/div>      <div class=\"quote\">“Chase, CoreWeave bought its F1 seat at Aston Martin in the year of its IPO; your Series F and the Austin race land in the same quarter, and the cloud-compute lane at Haas is open. 25 minutes before Las Vegas to see the numbers?”<\/div>\n    <\/div>\n  <\/section>\n\n  <section>\n    <div class=\"bottomline\"><div class=\"k\">Bottom line<\/div><div class=\"t\">A reported $3B+ Series F at ~$30B, a reported ~$13B Jane Street contract and a live 1.2 GW Stargate campus put Crusoe at peak brand-investment authority while its direct rival CoreWeave already sits on Aston Martin. Haas offers the open cloud-compute lane and two US home races inside the window.<\/div><\/div>\n    <div class=\"flags\"><span class=\"flag\">funding event<\/span><span class=\"flag\">mega contract<\/span><span class=\"flag\">category precedent<\/span><span class=\"flag\">discovery: scan<\/span><\/div>\n  <\/section>\n\n  <section>\n    <h2>Score composition<\/h2>\n    <div class=\"scoregrid\">\n      <div class=\"sc\">\n        <div class=\"pill\">TIMING<\/div>\n        <div class=\"val\">17 <span>/ 20<\/span><\/div>\n        <div class=\"bar\"><i style=\"width: 85%\"><\/i><\/div>\n        <div class=\"why\">Round reported 3 Sep; Austin and Las Vegas inside the window.<\/div>\n      <\/div>\n      <div class=\"sc\">\n        <div class=\"pill\">CAPACITY<\/div>\n        <div class=\"val\">20 <span>/ 20<\/span><\/div>\n        <div class=\"bar\"><i style=\"width: 100%\"><\/i><\/div>\n        <div class=\"why\">~$30B valuation, $3B+ raise, ~$13B contract (reported).<\/div>\n      <\/div>\n      <div class=\"sc\">\n        <div class=\"pill\">BRAND FIT<\/div>\n        <div class=\"val\">15 <span>/ 20<\/span><\/div>\n        <div class=\"bar\"><i style=\"width: 75%\"><\/i><\/div>\n        <div class=\"why\">Energy-plus-compute story; B2B brand, no consumer face.<\/div>\n      <\/div>\n      <div class=\"sc\">\n        <div class=\"pill\">URGENCY<\/div>\n        <div class=\"val\">13 <span>/ 20<\/span><\/div>\n        <div class=\"bar\"><i style=\"width: 65%\"><\/i><\/div>\n        <div class=\"why\">IPO-track narrative; no hard deadline.<\/div>\n      <\/div>\n      <div class=\"sc\">\n        <div class=\"pill\">OPS FIT<\/div>\n        <div class=\"val\">15 <span>/ 20<\/span><\/div>\n        <div class=\"bar\"><i style=\"width: 75%\"><\/i><\/div>\n        <div class=\"why\">MODE A: elastic GPU capacity outside the aero cap.<\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section>\n    <h2>Risks &amp; counters<\/h2>\n    <div class=\"risk\"><div class=\"rt\">REPORTED, NOT CONFIRMED<\/div><div class=\"rc\">The Series F and the Jane Street contract are Bloomberg-reported; no Crusoe release yet. <b>Counter:<\/b> Anchor on the confirmed Series E and Abilene facts; ask Crusoe to confirm the round on the first call.<\/div><\/div>\n    <div class=\"risk\"><div class=\"rt\">B2B BRAND, NO CMO<\/div><div class=\"rc\">Marketing sits at VP level; the audience is enterprise and capital markets, not fans. <b>Counter:<\/b> Frame it as IPO-window brand building on the CoreWeave precedent, with measurable enterprise activations.<\/div><\/div>\n  <\/section>\n\n  <section>\n    <h2>Sources <span class=\"note\">— 17 of 17 load-bearing claims verified<\/span><\/h2>\n    <ol class=\"sources\">\n<li><a href=\"https://www.globenewswire.com/news-release/2025/10/24/3172932/0/en/Crusoe-the-AI-Factory-Company-Raising-1-375-Billion-at-a-Valuation-Above-10-Billion-to-Power-the-Future-of-AI-Infrastructure.html\" target=\"_blank\" rel=\"noreferrer noopener\">https://www.globenewswire.com/news-release/2025/10/24/3172932/0/en/Crusoe-the-AI-Factory-Company-Raising-1-375-Billion-at-a-Valuation-Above-10-Billion-to-Power-the-Future-of-AI-Infrastructure.html<\/a><\/li><li><a href=\"https://www.bloomberg.com/news/articles/2026-09-03/crusoe-raises-over-3-billion-in-funding-at-30-billion-valuation\" target=\"_blank\" rel=\"noreferrer noopener\">https://www.bloomberg.com/news/articles/2026-09-03/crusoe-raises-over-3-billion-in-funding-at-30-billion-valuation<\/a><\/li><li><a href=\"https://www.crusoe.ai/resources/newsroom/crusoe-announces-series-e-funding\" target=\"_blank\" rel=\"noreferrer noopener\">https://www.crusoe.ai/resources/newsroom/crusoe-announces-series-e-funding<\/a><\/li><li><a href=\"https://www.astonmartinf1.com/en-GB/news/announcement/aston-martin-aramco-announces-coreweave-as-official-ai-cloud-computing-partner\" target=\"_blank\" rel=\"noreferrer noopener\">https://www.astonmartinf1.com/en-GB/news/announcement/aston-martin-aramco-announces-coreweave-as-official-ai-cloud-computing-partner<\/a><\/li><li><a href=\"https://www.bloomberg.com/news/ar AAAAAAAGAQBNwBAAAAAAAAAAAAABiE/w/8gOO6cxyfiAAAAABJRU5ErkJggg==\" alt=\"1440 Sports\">\n    <span class=\"meta\">Intelligence Brief · Confidential<br>N° 121 · 05 SEP 2026<\/span>\n  <\/div>\n  <div class=\"ribbon\">Intelligence Brief <span class=\"sep\">/<\/span> N° 121 <span class=\"sep\">·<\/span> HOT <span class=\"sep\">·<\/span> F1<\/div>\n\n  <h1>Crusoe<\/h1>\n  <div class=\"classline\">AI Infrastructure · GPU Cloud / Datacentre Builder · Denver, Colorado · Private (~$30B reported; $3B+ Series F, Sep 2026)<\/div>\n  <p class=\"lede\">Crusoe, the energy-first AI-infrastructure builder behind OpenAI's 1.2 GW Abilene campus, has reportedly closed a $3B+ Series F at a ~$30B valuation (Bloomberg, 3 Sep 2026), nearly tripling its October 2025 mark, days after a reported ~$13B five-year Jane Street cloud contract.<\/p>\n\n  <div class=\"strip\">\n    <div class=\"scorebox\"><div class=\"num\">80<\/div><div class=\"den\">Opportunity / 100<\/div><\/div>\n    <div class=\"chips\">\n      <div class=\"chip\"><div class=\"k\">Timing window<\/div><div class=\"v\">HOT<\/div><\/div>\n      <div class=\"chip\"><div class=\"k\">Series<\/div><div class=\"v\">F1<\/div><\/div>\n      <div class=\"chip\"><div class=\"k\">Recommended team<\/div><div class=\"v\">TGR Haas F1 Team<\/div><\/div>\n      <div class=\"chip\"><div class=\"k\">Action horizon<\/div><div class=\"v\">6-10 WKS<\/div><\/div>\n    <\/div>\n  <\/div>\n\n  <section>\n    <h2>The case<\/h2>\n    <p>Crusoe's reported $3B+ Series F at roughly $30B post-money, co-led by Atreides Management and Valor Equity Partners with Mubadala Capital participating, nearly triples the $10B+ valuation set by its $1.375B Series E in October 2025. The company builds and powers gigawatt-scale AI data centres - the first phase of the 1.2 GW Stargate campus in Abilene, Texas is live for Oracle and OpenAI - and sells GPU cloud to OpenAI, Microsoft and Meta. Bloomberg also reports a ~$13B, five-year AI-cloud contract with Jane Street, its highest-profile cloud customer yet.<\/p>\n<p>The grid has already proved this archetype buys F1: CoreWeave signed with Aston Martin Aramco in May 2025 as Official AI Cloud Computing Partner, and Core Scientific joined Cadillac for 2026. Crusoe's closest rival is on the grid and Crusoe is not, and no team carries a brand that owns both halves of the AI build-out, the power and the compute.<\/p>  <\/section>\n\n  <section>\n    <h2>Why now <span class=\"note\">— the clock this signal is on<\/span><\/h2>\n    <div class=\"clock\">\n      <div class=\"tick\"><div class=\"tl\">Trigger<\/div><div class=\"tt\">Bloomberg reported on 3 September that Crusoe closed more than $3B of Series F capital at roughly $30B post-money, co-led by Atreides Management and Valor Equity Partners with Mubadala Capital participating. That is close to three times the valuation set by its $1.375B Series E in October 2025, and it lands in the same week as a reported ~$13B, five-year AI-cloud contract with Jane Street.<\/div><\/div>\n      <div class=\"tick\"><div class=\"tl\">Budget authority<\/div><div class=\"tt\">A raise of this size resets the brand and marketing budget for the next 12 to 18 months. With OpenAI, Microsoft, Meta and now Jane Street already on the customer list, the next buyers Crusoe has to reach are enterprise CIOs, CFOs and the capital-markets audience ahead of a probable listing. That is the audience a Formula 1 partnership puts in the room.<\/div><\/div>\n      <div class=\"tick\"><div class=\"tl\">Calendar window<\/div><div class=\"tt\">The US GP in Austin (late October) and the Las Vegas GP (November) are the two remaining home-market races of 2026. A partnership agreed before Austin can be announced there and activated in full for 2027; teams close their 2027 partner rosters in the fourth quarter.<\/div><\/div>\n      <div class=\"tick\"><div class=\"tl\">Competitive clock<\/div><div class=\"tt\">CoreWeave, Crusoe's closest listed rival, has held the Official AI Cloud Computing Partner slot at Aston Martin Aramco since May 2025, and Core Scientific joined Cadillac for 2026. Fluidstack raised a reported $1.5B at an $18B valuation this week and is the next name likely to shop for a grid position. The open cloud-compute lanes will not stay open through 2027.<\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <section>\n    <h2>Proof points\n<span class=\"note\">— every figure checked against its source (see Sources)<\/span>\n    <\/h2>\n    <div class=\"proof\">\n      <div class=\"pf\"><div class=\"pfv\">$3B+<\/div><div class=\"pfk\">$3B+ Series F at ~$30B post-money, reported by Bloomberg 3 Sep 2026<\/div><\/div>\n      <div class=\"pf\"><div class=\"pfv\">$13B<\/div><div class=\"pfk\">Bloomberg also reports a ~$13B, five-year AI-cloud contract with Jane Street, its highest-profile cloud cus…<\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <section>\n    <h2>Why Tgr Haas F1 Team <span class=\"note\">— the open lane, the audience, the platform<\/span><\/h2>\n    <div class=\"args\">\n      <div class=\"arg\"><div class=\"al\">The open lane<\/div><div class=\"at\">Haas carries no cloud, GPU or AI-compute partner. Its technology roster is Toyota Gazoo Racing as title partner, Mphasis for digital services and RUCKUS Networks for networking, which leaves Official AI Cloud Compute Partner a clean, ownable category at a team-partner price rather than a title price.<\/div><\/div>\n      <div class=\"arg\"><div class=\"al\">Audience and market fit<\/div><div class=\"at\">Haas is the American privateer in a US-owned sport; Crusoe is a Denver company whose growth story (Abilene, Wyoming, Jane Street) is American. Austin and Las Vegas are US rounds still to come in 2026, and the team's guest lists at those events are the enterprise and capital-markets buyers Crusoe is selling to.<\/div><\/div>\n      <div class=\"arg\"><div class=\"al\">A team that will use the product<\/div><div class=\"at\">Haas is the grid's lean privateer, so it has the most to gain from elastic GPU capacity for simulation, strategy and analytics work. The partnership would be consumed in the factory, not just displayed on the car, which is what separates a technology partner from a logo.<\/div><\/div>\n      <div class=\"arg\"><div class=\"al\">Precedent and price<\/div><div class=\"at\">CoreWeave's Aston Martin deal proves a neocloud buys Formula 1. The Haas lane comes at a team-partner entry tier, an estimated $5-8M a year and part-payable in compute credits, with sidepod placement and naming of the team's compute environment. The precedent removes the category doubt; the price makes it an easy first commitment.<\/div><\/div>\n    <\/div>\n    <div style=\"margin-top:18px\">\n      <div class=\"gfrow rec\">\n        <div class=\"gft\">MoneyGram Haas F1 Team<span class=\"star\">◆ Recommended<\/span><\/div>\n        <div class=\"gflab open\">OPEN<\/div>\n        <div class=\"gfd\">no rival in this category lane<\/div>\n      <\/div>\n      <div class=\"gfrow \">\n        <div class=\"gft\">McLaren F1 Team<\/div>\n        <div class=\"gflab conflict\">TAKEN<\/div>\n        <div class=\"gfd\">Dell Technologies, Google Cloud, Schneider Electric<\/div>\n      <\/div>\n      <div class=\"gfrow \">\n        <div class=\"gft\">Aston Martin Aramco F1 Team<\/div>\n        <div class=\"gflab conflict\">TAKEN<\/div>\n        <div class=\"gfd\">CoreWeave, NetApp<\/div>\n      <\/div>\n      <div class=\"gfrow \">\n        <div class=\"gft\">Mercedes-AMG Petronas F1 Team<\/div>\n        <div class=\"gflab conflict\">TAKEN<\/div>\n        <div class=\"gfd\">Microsoft<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"tablewrap\">\n    <table class=\"ruled\">\n      <thead><tr><th>Ruled out<\/th><th>Why the lane is closed<\/th><\/tr><\/thead>\n      <tbody>\n      <tr><td class=\"t\">Aston Martin Aramco F1 Team<\/td><td>CoreWeave, Official AI Cloud Computing Partner since May 2025, is Crusoe's direct rival.<\/td><\/tr>\n      <tr><td class=\"t\">Cadillac F1 Team<\/td><td>Core Scientific (data-centre and HPC hosting) and TWG AI sit on the inaugural 2026 roster.<\/td><\/tr>\n      <tr><td class=\"t\">Oracle Red Bull Racing<\/td><td>Oracle is title partner and the cloud and compute incumbent.<\/td><\/tr>\n      <tr><td class=\"t\">Mercedes-AMG Petronas F1 Team<\/td><td>Microsoft holds the cloud lane.<\/td><\/tr>\n      <tr><td class=\"t\">McLaren F1 Team<\/td><td>Google Cloud, Dell Technologies and Schneider Electric occupy cloud, hardware and data-centre power.<\/td><\/tr>\n      <tr><td class=\"t\">BWT Alpine F1 Team<\/td><td>Microsoft holds the cloud lane.<\/td><\/tr>\n      <tr><td class=\"t\">Scuderia Ferrari<\/td><td>HP (title) and IBM cover compute hardware and cloud services.<\/td><\/tr>\n      <tr><td class=\"t\">Audi F1 Team · Racing Bulls · Williams<\/td><td>Lane open but not chosen: European rosters and audiences; Haas gives the US home-market platform the signal needs.<\/td><\/tr>\n      <\/tbody>\n    <\/table>\n    <\/div>\n  <\/section>\n\n  <section>\n    <h2>Value To Tgr Haas F1 Team <span class=\"note\">— Mode A · tech in the car / championship<\/span><\/h2>\n    <div class=\"args\">\n      <div class=\"arg\"><div class=\"al\">Operational workstream (Mode A)<\/div><div class=\"at\">Elastic GPU capacity for the work that sits outside the FIA's aerodynamic-testing restrictions: machine-learning surrogate models, driver-in-the-loop and race-strategy simulation, and telemetry and video analytics between sessions. Crusoe supplies capacity on demand; the team gets compute it could not fund inside the cost cap.<\/div><\/div>\n      <div class=\"arg\"><div class=\"al\">Commercial lift for the team<\/div><div class=\"at\">A partner that sells to CIOs and CFOs brings a guest list of enterprise buyers, investors and bankers to Austin and Las Vegas, the same audience Haas's other B2B partners (Mphasis, RUCKUS, MoneyGram) want in the suite. Crusoe's own customers, OpenAI, Microsoft, Meta and Jane Street, are a hospitality draw in their own right.<\/div><\/div>\n      <div class=\"arg\"><div class=\"al\">Content and ecosystem<\/div><div class=\"at\">An energy-to-compute story the team can tell on camera: a Denver company that turns power into AI capacity, running the race team's models. It gives Haas a technology narrative it does not currently own, and gives Crusoe a proof-of-value case study for enterprise sales.<\/div><\/div>\n      <div class=\"arg\"><div class=\"al\">What the team gives back<\/div><div class=\"at\">Official AI Cloud Compute Partner designation, sidepod or engine-cover placement, naming of the team's compute environment, hospitality at Austin and Las Vegas, driver and engineering access for Crusoe's enterprise channels, and a factory reference customer for Crusoe's cloud.<\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <section>\n    <h2>Deal architecture<\/h2>\n    <p>Entry as Official AI Cloud Compute Partner. <b class=\"hl\">THREE YEARS<\/b>, 2027-2029, spanning a probable listing window and three US-race cycles. Estimated $5-8M/yr, part-payable in compute credits. Scope: sidepod placement, naming of the team's compute environment, Austin and Las Vegas hospitality, co-produced engineering content.<\/p>\n    <div class=\"ask\"><span class=\"k\">The ask<\/span>A 25-minute call with Chase Lochmiller before the Las Vegas GP to confirm the Series F on the record, agree the Austin announcement window, and size the entry tier against Haas's 2027 partner roster.<\/div>\n  <\/section>\n\n  <section class=\"twocol\">\n    <div>\n      <h2>Primary decision-maker<\/h2>\n      <div class=\"dm\">\n        <div class=\"name\">Chase Lochmiller<\/div>\n        <div class=\"role\">CEO &amp; Co-Founder, Crusoe · <span class=\"vtag\">verified<\/span><\/div>\n        <div class=\"bio\">Lochmiller co-founded Crusoe in 2018 and fronts every raise and mega-contract; a deal of this scale is his call. Path: Sharieff Mansour, VP Marketing (sponsorship owner; reported), Cully Cavness, President and Chief Strategy Officer, and CTO Nitin Perumbeti on compute scope.<\/div>\n      <\/div>\n    <\/div>\n    <div>\n      <h2>Opening angle<\/h2>\n<div class=\"intro\">Lead with the Aston Martin precedent.<\/div>      <div class=\"quote\">“Chase, CoreWeave bought its F1 seat at Aston Martin in the year of its IPO; your Series F and the Austin race land in the same quarter, and the cloud-compute lane at Haas is open. 25 minutes before Las Vegas to see the numbers?”<\/div>\n    <\/div>\n  <\/section>\n\n  <section>\n    <div class=\"bottomline\"><div class=\"k\">Bottom line<\/div><div class=\"t\">A reported $3B+ Series F at ~$30B, a reported ~$13B Jane Street contract and a live 1.2 GW Stargate campus put Crusoe at peak brand-investment authority while its direct rival CoreWeave already sits on Aston Martin. Haas offers the open cloud-compute lane and two US home races inside the window.<\/div><\/div>\n    <div class=\"flags\"><span class=\"flag\">funding event<\/span><span class=\"flag\">mega contract<\/span><span class=\"flag\">category precedent<\/span><span class=\"flag\">discovery: scan<\/span><\/div>\n  <\/section>\n\n  <section>\n    <h2>Score composition<\/h2>\n    <div class=\"scoregrid\">\n      <div class=\"sc\">\n        <div class=\"pill\">TIMING<\/div>\n        <div class=\"val\">17 <span>/ 20<\/span><\/div>\n        <div class=\"bar\"><i style=\"width: 85%\"><\/i><\/div>\n        <div class=\"why\">Round reported 3 Sep; Austin and Las Vegas inside the window.<\/div>\n      <\/div>\n      <div class=\"sc\">\n        <div class=\"pill\">CAPACITY<\/div>\n        <div class=\"val\">20 <span>/ 20<\/span><\/div>\n        <div class=\"bar\"><i style=\"width: 100%\"><\/i><\/div>\n        <div class=\"why\">~$30B valuation, $3B+ raise, ~$13B contract (reported).<\/div>\n      <\/div>\n      <div class=\"sc\">\n        <div class=\"pill\">BRAND FIT<\/div>\n        <div class=\"val\">15 <span>/ 20<\/span><\/div>\n        <div class=\"bar\"><i st   const $ = (s, el) => (el || document).querySelector(s);

  const fmtDate = (iso) => { if (!iso) return ''; const d = new Date(iso.length === 10 ? iso + 'T00:00:00' : iso); return isNaN(d) ? esc(iso) : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };

  async function requestRebuild(number) {
    const b = all().find((x) => String(x.number) === String(number));
    if (!b) return;

    const issueUrl = `https://github.com/${REPO}/issues/new?title=${encodeURIComponent(`Rebuild: ${b.company} (${b.date})`)}&body=${encodeURIComponent(`Build the full case for ${b.company}, signal of ${b.date}.\n\nCommand: ${cmd}`)}`;
