    panel.innerHTML = `<div class="note ${queued ? 'info' : ''}" style="margin-top:16px">
      <b>${queued ? 'Queued.' : 'Request the full case.'}</b> ${queued ? `The next run builds the full case for ${esc(b.company)} and it appears here.` : `Open a one-line request on GitHub (the daily job reads the queue), or run the command on the daily-job service.`}
      <div class="actions" style="margin-top:10px">${queued ? '' : `<a class="btn gold" href="${issueUrl}" target="_blank" rel="noreferrer noopener">Open request</a>`}<button type="button" class="btn" id="copycmd">Copy command</button></div>
      <div style="margin-top:10px"><code>${esc(cmd)}</code></div></div>`;
    const copy = $('#copycmd');
    if (copy) copy.addEventListener('click', async () => { try { await navigator.clipboard.writeText(cmd); copy.textContent = 'Copied'; } catch (e) { copy.textContent = 'Select and copy above'; } });
    panel.scrollIntoView({ block: 'nearest' });
  }

  // ---- views ----
  function tag(b) {
    const out = [];
    out.push(`<span class="badge ${verClass(b.verification)}">${verLabel(b.verification)}</span>`);
    if (b.review.status === 'keep_flagged') out.push('<span class="badge warn" title="' + esc(b.review.reason || '') + '">Check</span>');
    if (b.deal_update) out.push(`<span class="badge navy">Now partner · ${esc(teamDisplay(b.deal_update.team))}</span>`);
    return out.join(' ');
  }

  function table(rows, opts) {
    opts = opts || {};
    if (!rows.length) return '<div class="tablewrap"><div class="empty">Nothing here yet.</div></div>';
    return `<div class="tablewrap"><table><thead><tr><th>Date</th><th>N°</th><th>Company</th><th>Series</th><th>Team</th><th>Score</th><th>Status</th></tr></thead><tbody>
      ${rows.map((b) => `<tr class="row" data-go="#/brief/${b.number}">
        <td class="date">${fmtDate(b.date)}</td>
        <td class="num">${esc(b.label)}</td>
        <td class="co">${esc(b.company)}<span class="sm">${esc(b.industry || b.trigger || '')}</span></td>
        <td>${esc(b.series || '—')}${b.series_inferred ? '<span class="sm">inferred</span>' : ''}</td>
        <td>${esc(teamDisplay(b.team) || '—')}</td>
        <td class="num">${b.score != null ? esc(b.score) : '—'}<span class="sm">${esc(b.tier || '')}</span></td>
        <td>${tag(b)}</td>
      </tr>`).join('')}
    </tbody></table></div>`;
  }

  function homeView() {
    const t = D.today;
    const f1 = bySeries('F1'), fe = bySeries('FE'), rows = live();
    const latest = (arr) => arr[0] ? `${esc(arr[0].company)} · ${fmtDate(arr[0].date)}` : 'nothing yet';
    let hero = '<div class="today"><div class="empty" style="grid-column:1/-1">No verified signal has been issued yet.</div></div>';
    if (t) {
      hero = `
      <div class="today">
        <div class="score"><div class="n">${esc(t.score)}</div><div class="d">Opportunity / 100</div><div class="tier">${esc(t.tier || '')}</div></div>
        <div>
          <div class="eyebrow">Today's signal · ${esc(t.label)} · ${fmtDate(t.date)}</div>
          <h2>${esc(t.company)}</h2>
          <div class="meta">${esc(t.industry || '')}</div>
          <p class="deck">${esc(t.deck || t.take || '')}</p>
          <div class="facts">
            <div>Series<b>${esc(t.series || '—')}</b></div>
            <div>Recommended team<b>${esc(teamDisplay(t.team) || '—')}</b></div>
            <div>Decision-maker<b>${esc(t.person || '—')}${t.role ? ' · ' + esc(t.role) : ''}</b></div>
            <div>Action horizon<b>${esc(t.horizon || '—')}</b></div>
            ${t.trigger_date && t.trigger_date !== t.date ? `<div>Trigger date<b>${fmtDate(t.trigger_date)}</b></div>` : ''}
          </div>
          <div class="badges">
            <span class="badge ${verClass(t.verification)}">${verLabel(t.verification)}</span>
            <span class="badge ${t.audit === 'pass' || t.audit === 'pass_after_retry' ? 'ok' : 'warn'}">Audit ${esc(t.audit)}</span>
            ${t.confidence && t.confidence !== 'HIGH' ? `<span class="badge warn">Confidence ${esc(t.confidence)}</span>` : ''}
            ${(t.signals || []).map((s) => `<span class="badge info">${esc(s.replace(/_/g, ' '))}</span>`).join('')}
          </div>
          <div class="actions">
            <a class="btn gold" href="#/brief/${t.number}">Read the full brief</a>
          </div>
        </div>
      </div>`;
    }
    return `
      <div class="head"><div><div class="eyebrow">${esc(D.execution_mode || '')} · generated ${fmtDate((D.generated_at || '').slice(0, 10))}</div><h1>Home</h1><p class="sub">One verified signal a day: who to call, why now, which team. Open any signal to read the case.</p></div></div>
      ${hero}
      <div class="rule"><span>Signals</span></div>
      <div class="tiles">
        <a class="tile" href="#/signals/F1"><div class="k">Formula 1</div><div class="n">${f1.length}</div><div class="t">Latest: ${latest(f1)}</div><div class="go">Open F1 signals →</div></a>
        <a class="tile" href="#/signals/FE"><div class="k">Formula E</div><div class="n">${fe.length}</div><div class="t">Latest: ${latest(fe)}</div><div class="go">Open FE signals →</div></a>
        <a class="tile" href="#/signals/all"><div class="k">All signals</div><div class="n">${rows.length}</div><div class="t">Date-wise, back to ${fmtDate(rows[rows.length - 1] ? rows[rows.length - 1].date : '')}</div><div class="go">Open the log →</div></a>
      </div>
      <div class="rule"><span>Most recent</span></div>
      ${table(rows.slice(0, 8))}`;
  }

  function signalsView(series) {
    const title = series === 'all' ? 'All signals' : (series === 'F1' ? 'Formula 1 signals' : 'Formula E signals');
    const rows = series === 'all' ? live() : bySeries(series);
    const inferred = rows.filter((b) => b.series_inferred).length;
    const flagged = rows.filter((b) => b.review.status === 'keep_flagged').length;
    return `
      <div class="head"><div><div class="eyebrow">Signals</div><h1>${title}</h1><p class="sub">${rows.length} signals, newest first.${inferred ? ` ${inferred} older rows had no series recorded; theirs is inferred from the text and marked.` : ''}${flagged ? ` ${flagged} carry a "Check" tag: kept, but a detail needs a human look before they are pitched.` : ''}</p></div>
      </div>
      <div class="toolbar"><input id="q" type="search" placeholder="Search company, team, trigger…"><select id="tier"><option value="">All tiers</option><option>HOT TOP TIER</option><option>HOT</option><option>WARM</option></select><span class="seg"><button data-hist="all" class="on">All</button><button data-hist="live">Engine briefs</button><button data-hist="hist">Historical</button></span></div>
      <div id="list">${table(rows)}</div>`;
  }


  function briefView(number) {
    const b = all().find((x) => String(x.number) === String(number));
    if (!b) return '<div class="head"><div><h1>Brief not found</h1></div></div>';
    const back = `#/signals/${b.series || 'all'}`;
    const head = `<div class="head"><div><div class="eyebrow">${esc(b.label)} · ${fmtDate(b.date)} · ${esc(b.series || '')}${b.series_inferred ? ' (inferred)' : ''}</div><h1>${esc(b.company)}</h1><div class="badges">${tag(b)}</div></div>
      <div class="actions"><a class="btn" href="${back}">← Back</a>${b.page_html ? '' : `<button type="button" class="btn gold" data-rebuild="${b.number}">Build the full case</button>`}</div></div>`;
    if (b.page_html) {
      return head + `<div class="reader"><iframe title="Brief ${esc(b.label)} — ${esc(b.company)}" srcdoc="${esc(b.page_html)}"></iframe></div>`;
    }
    const checkNote = b.review.status === 'keep_flagged' ? `<div class="note"><b>Check before pitching.</b> ${esc(b.review.reason || '')}</div>` : '';
    const dealNote = b.deal_update ? `<div class="note info"><b>Update.</b> ${esc(b.company)} is now a ${esc(b.deal_update.status)} partner of ${esc(teamDisplay(b.deal_update.team))}${b.deal_update.season ? ' (' + esc(b.deal_update.season) + ' roster)' : ''}${b.deal_update.notes ? ' — ' + esc(b.deal_update.notes) : ''}. The lane this signal pointed at is no longer open; treat the row as a closed case.</div>` : '';
    return head + `<div class="detail">
      ${dealNote}${checkNote}
      ${b.historical ? '<div class="note info">Historical signal imported from the previous system — a headline and a source, not a verified case. Build the full case to get the Crusoe-standard brief: live verification of every claim, the 13-rule audit, the 2-page PDF and this long-form page.</div>' : ''}
      <p>${esc(b.deck || b.take || 'No summary was stored for this signal.')}</p>
      ${b.bottom_line ? `<p><b>Bottom line.</b> ${esc(b.bottom_line)}</p>` : ''}
      <dl>
        <dt>Score</dt><dd>${esc(b.score != null ? b.score + ' / 100 · ' + (b.tier || '') : '—')}</dd>
        <dt>Team</dt><dd>${esc(teamDisplay(b.team) || '—')}</dd>
        <dt>Decision-maker</dt><dd>${esc(b.person || '—')}${b.role ? ' · ' + esc(b.role) : ''}</dd>
        <dt>Trigger</dt><dd>${esc(b.trigger || '—')}${b.trigger_date ? ' · ' + fmtDate(b.trigger_date) : ''}</dd>
        <dt>Horizon</dt><dd>${esc(b.horizon || '—')}</dd>
        <dt>Verification</dt><dd><span class="badge ${verClass(b.verification)}">${verLabel(b.verification)}</span></dd>
        <dt>Source</dt><dd>${b.source_url ? `<a href="${esc(b.source_url)}" target="_blank" rel="noreferrer noopener">${esc(b.source_url)}</a>` : '—'}</dd>
        ${b.also_surfaced && b.also_surfaced.length ? `<dt>Also surfaced</dt><dd>${b.also_surfaced.map(fmtDate).join(' · ')} — folded into this case</dd>` : ''}
      </dl>
      ${b.deal_update ? '' : `<div class="cta"><div><span class="k">Full case</span><p>Runs the whole pipeline for ${esc(b.company)} on the daily-job service: live research, claim-by-claim verification, the 13-rule audit, then the 2-page PDF and the long-form page. Ready in the app after the next run.</p></div><button type="button" class="btn" data-rebuild="${b.number}">Build the full case</button></div>`}
      <div id="reqpanel" hidden></div>
    </div>`;
  }

  function sponsorsView(series) {
    const rows = (D.sponsors || []).filter((s) => s.series === series);
    const liveRows = rows.filter((s) => s.status === 'active' || s.status === 'joined');
    const withEnd = liveRows.filter((s) => s.until).length;
    const teams = {};
    liveRows.filter((s) => s.team).forEach((s) => { (teams[s.team] = teams[s.team] || []).push(s); });
    const champ = liveRows.filter((s) => !s.team);
    const profiles = {}; teamsFor(series).forEach((t) => { profiles[t.team] = t; });
    const cats = {};
    liveRows.filter((s) => s.category).forEach((s) => { (cats[s.category] = cats[s.category] || []).push(s); });
    const until = (s) => s.until ? `${esc(s.until)} <span class="sm">${s.until_kind === 'confirmed' ? 'confirmed' : 'reported'}</span>` : '<span class="sm">not stated</span>';
    const since = (s) => s.since ? esc(s.since) : `<span class="sm">${s.status === 'joined' ? 'new for ' : 'on the '}${esc(s.season || '')} roster</span>`;
    const rowsHtml = (list) => `<div class="tablewrap"><table><thead><tr><th>Brand</th><th>Category</th><th>Level</th><th>Status</th><th>Since</th><th>Until</th><th>Notes</th></tr></thead><tbody>
      ${list.map((s) => `<tr data-brand="${esc(s.brand.toLowerCase())}" data-cat="${esc((s.category || '').toLowerCase())}" data-level="${esc(s.level)}"><td class="co">${esc(s.brand)}</td><td>${s.category ? `<span class="cat">${esc(s.category)}</span>` : '<span class="sm">—</span>'}</td><td><span class="sm">${esc((s.level || '').replace(/_/g, ' '))}</span></td><td><span class="badge ${s.status === 'active' ? 'ok' : (s.status === 'joined' ? 'info' : 'mute')}">${esc(s.status)}</span></td><td class="num">${since(s)}</td><td class="num">${until(s)}</td><td><span class="sm">${esc(s.notes || '')}</span></td></tr>`).join('')}
    </tbody></table></div>`;
    const teamKeys = Object.keys(teams).sort((a, b) => teamDisplay(a).localeCompare(teamDisplay(b)));
    const slug = (t) => 'team-' + t.toLowerCase().replace(/[^a-z0-9]+/g, '-');
    const teamBlocks = teamKeys.map((team) => {
      const p = profiles[team] || {};
      const list = teams[team].sort((a, b) => (a.level || '').localeCompare(b.level || '') || a.brand.localeCompare(b.brand));
      const open = (p.open_categories || []).length ? `<span class="badge ok">${p.open_categories.length} open</span>` : '';
      const titles = list.filter((s) => s.level === 'team_title').map((s) => s.brand);
      return `<details class="teamblock" id="${slug(team)}"><summary><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg><span class="tn">${esc(teamDisplay(team))}</span><span class="ti">${esc(p.identity || '')}${titles.length ? ' · title: ' + esc(titles.join(', ')) : ''}</span><span class="stats"><span class="badge info">${list.length} partners</span>${open}</span></summary>
        ${p.open_categories && p.open_categories.length ? `<div class="open-cats">Documented open categories: ${p.open_categories.map(esc).join(' · ')}</div>` : ''}
        <div style="padding:12px 0 0">${rowsHtml(list)}</div></details>`;
    }).join('');
    const catCards = Object.keys(cats).sort().map((c) => `<div class="catcard"><div class="k"><span>${esc(c)}</span><span>${cats[c].length}</span></div><ul>${cats[c].map((s) => `<li><span>${esc(s.brand)}</span><span>${esc(s.team ? teamDisplay(s.team) : series + ' championship')}</span></li>`).join('')}</ul></div>`).join('');
    return `
      <div class="head"><div><div class="eyebrow">Grid</div><h1>${series === 'F1' ? 'Formula 1' : 'Formula E'} sponsors</h1><p class="sub">Every live partner on the ${series} grid, by team or by category, with when they joined and when the deal is reported to end. "Not stated" means no public end date, not an open-ended deal.</p></div><div class="actions"><span class="seg"><button class="on" data-view="team">By team</button><button data-view="category">By category</button></span></div></div>
      <div class="kpis"><div class="kpi"><div class="k">Teams</div><div class="n">${teamKeys.length}</div></div><div class="kpi"><div class="k">Live partners</div><div class="n">${liveRows.length}</div></div><div class="kpi"><div class="k">Joined this season</div><div class="n">${liveRows.filter((s) => s.status === 'joined').length}</div></div><div class="kpi"><div class="k">Reported end date</div><div class="n">${withEnd}</div></div></div>
      <div class="toolbar"><input id="sq" type="search" placeholder="Find a brand or category…"><select id="slevel"><option value="">All levels</option><option value="team_title">Team title</option><option value="team_major">Team partner</option><option value="powertrain">Powertrain</option><option value="championship_global">Championship global</option><option value="championship_official">Championship official</option></select><span class="seg"><button data-exp="open">Expand all</button><button data-exp="close">Collapse all</button></span></div>
      <div id="vteam">
        <div class="teamnav">${teamKeys.map((t) => `<a href="#${slug(t)}" data-jump="${slug(t)}">${esc(teamDisplay(t))}</a>`).join('')}</div>
        <div class="rule"><span>Championship-level partners</span><span class="cnt">${champ.length}</span></div>${rowsHtml(champ)}
        <div class="rule"><span>Teams</span><span class="cnt">${teamKeys.length}</span></div>${teamBlocks}
        <details class="teamblock"><summary><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg><span class="tn">Departed partners</span><span class="ti">kept for alumni and category context</span><span class="stats"><span class="badge mute">${rows.filter((s) => s.status === 'departed').length}</span></span></summary><div style="padding:12px 0 0">${rowsHtml(rows.filter((s) => s.status === 'departed'))}</div></details>
      </div>
      <div id="vcat" hidden><div class="rule"><span>Live partners by category</span><span class="cnt">${Object.keys(cats).length}</span></div><div class="catgrid">${catCards || '<div class="empty">No categorised partners.</div>'}</div></div>`;
  }

  function calendarView() {
    const cal = D.calendar || [];
    const f1 = cal.filter((c) => c.series === 'F1');
    const s12 = cal.filter((c) => c.series === 'FE' && c.season === 2026);
    const s13 = cal.filter((c) => c.series === 'FE' && c.season === 2027);
    const rows = (list) => `<div class="tablewrap"><table><thead><tr><th>Round</th><th>Race</th><th>Date</th><th>Title sponsor</th><th>Status</th></tr></thead><tbody>${list.map((c) => `<tr><td class="num">${esc(c.round)}</td><td class="co">${esc(c.name)}${c.city && !c.name.includes(c.city) ? ` · ${esc(c.city)}` : ''}${c.notes ? `<span class="sm">${esc(c.notes)}</span>` : ''}</td><td class="date">${c.date_start ? fmtDate(c.date_start) : '<span class="sm">date to confirm</span>'}</td><td>${esc(c.title_sponsor || '—')}</td><td><span class="badge ${c.status === 'confirmed' ? 'mute' : (c.status === 'confirmed' ? 'ok' : 'warn')}">${esc(c.status || '')}</span></td></tr>`).join('')}</tbody></table></div>`;
    return `
      <div class="head"><div><div class="eyebrow">Dashboards</div><h1>Calendar</h1><p class="sub">The rounds the engine is allowed to name. A race not on these lists blocks a brief, by design.</p></div></div>
      <div class="rule"><span>Formula E · Season 13 (2026-27) · GEN4 era</span><span class="cnt">${s13.length} races</span></div>${s13.length ? rows(s13) : '<div class="tablewrap"><div class="empty">Not loaded.</div></div>'}
      <div class="rule"><span>Formula 1 · 2026</span><span class="cnt">${f1.length} rounds</span></div>${rows(f1)}
      <div class="rule"><span>Formula E · Season 12 (2025-26) · completed</span><span class="cnt">${s12.length} races</span></div>${s12.length ? rows(s12) : '<div class="tablewrap"><div class="empty">Not loaded.</div></div>'}`;
  }

  // ---- router ----
  function route() {
    const hash = location.hash || '#/home';
    const parts = hash.slice(2).split('/');
    const main = $('#main');
    let nav = 'home';
    if (parts[0] === 'signals') { main.innerHTML = signalsView(parts[1] || 'all'); nav = parts[1] || 'all'; bindSignals(parts[1] || 'all'); }
    else if (parts[0] === 'brief') { main.innerHTML = briefView(parts[1]); const b = all().find((x) => String(x.number) === String(parts[1])); nav = b && b.series ? b.series : 'all'; bindRebuild(); }
    else if (parts[0] === 'sponsors') { main.innerHTML = sponsorsView(parts[1] || 'F1'); nav = 's' + (parts[1] || 'F1'); bindSponsors(); }
    else if (parts[0] === 'calendar') { main.innerHTML = calendarView(); nav = 'calendar'; }
    else { main.innerHTML = homeView(); }
    document.querySelectorAll('.side a[data-nav]').forEach((a) => a.classList.toggle('active', a.dataset.nav === nav));
    $('#side').classList.remove('open');
    if (!(parts[0] === 'sponsors' && location.hash.includes('team-'))) window.scrollTo(0, 0);
    bindRows();
  }
  function bindRows() { document.querySelectorAll('tr.row[data-go]').forEach((tr) => { tr.addEventListener('click', () => { location.hash = tr.dataset.go; }); }); }
  function bindSignals(series) {
    const base = series === 'all' ? live() : bySeries(series);
    let hist = 'all';
    const apply = () => {
      const q = ($('#q').value || '').toLowerCase();
      const tier = $('#tier').value;
      const rows = base.filter((b) => (!q || [b.company, b.team, b.trigger, b.industry, b.person].join(' ').toLowerCase().includes(q)) && (!tier || (b.tier || '') === tier) && (hist === 'all' || (hist === 'hist' ? b.historical : !b.historical)));
      $('#list').innerHTML = table(rows); bindRows();
    };
    $('#q').addEventListener('input', apply); $('#tier').addEventListener('change', apply);
    document.querySelectorAll('[data-hist]').forEach((b) => b.addEventListener('click', () => { hist = b.dataset.hist; document.querySelectorAll('[data-hist]').forEach((x) => x.classList.toggle('on', x === b)); apply(); }));
  }
  function bindSponsors() {
    document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => {
      document.querySelectorAll('[data-view]').forEach((x) => x.classList.toggle('on', x === b));
      $('#vteam').hidden = b.dataset.view !== 'team'; $('#vcat').hidden = b.dataset.view !== 'category';
    }));
    document.querySelectorAll('[data-exp]').forEach((b) => b.addEventListener('click', () => { document.querySelectorAll('.teamblock').forEach((d) => { d.open = b.dataset.exp === 'open'; }); }));
    document.querySelectorAll('[data-jump]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); const d = document.getElementById(a.dataset.jump); if (d) { d.open = true; d.scrollIntoView({ block: 'start' }); } }));
    const filter = () => {
      const q = ($('#sq').value || '').toLowerCase(); const lv = $('#slevel').value;
      document.querySelectorAll('#vteam tr[data-brand]').forEach((tr) => { tr.hidden = !((!q || tr.dataset.brand.includes(q) || tr.dataset.cat.includes(q)) && (!lv || tr.dataset.level === lv)); });
      if (q) document.querySelectorAll('.teamblock').forEach((d) => { d.open = !!d.querySelector('tr[data-brand]:not([hidden])'); });
    };
    $('#sq').addEventListener('input', filter); $('#slevel').addEventListener('change', filter);
  }

  function boot() {
    $('#cF1').textContent = bySeries('F1').length; $('#cFE').textContent = bySeries('FE').length; $('#cAll').textContent = live().length;
    $('#mode').textContent = (D.execution_mode || '') + ' mode';
    window.addEventListener('hashchange', route); route();
  }
  $('#menu').addEventListener('click', () => $('#side').classList.toggle('open'));
  const tick = () => { $('#clock').textContent = new Date().toLocaleTimeString('en-GB', { timeZone: 'Europe/London', hour12: false }); };
  tick(); setInterval(tick, 1000);
  load();
})();
</script>
</body>
</html>
